source:
  paper_title: 'KernelSkill: Dual-Memory Multi-Agent CUDA Kernel Optimization'
  paper_url: ''
  notes: clean per spec §7.2; full phase spec deferred. Tier disputed — see tier-revision-proposal.md.
workflow:
  name: kernelskill-kernel-optimization
  description: 'Multi-agent CUDA kernel optimization with a dual-level memory: a curated
    long-term expert skill library (deterministic decision policy + method knowledge)
    and short-term per-task optimize/repair trajectory memory. Each refinement round
    branches into a repair path (invalid kernel) or an optimize path (valid kernel)
    driven by ncu+nsys profiling (KernelSkill / KernelMem methodology).'
  when_to_use: When generating and optimizing custom CUDA kernels from a PyTorch reference,
    and you want optimization-method selection to be explicit, auditable, and grounded
    in profiling evidence rather than relying on the model
  output_filename: kernelskill-kernel-optimization.js
  directory: KernelSkill/
