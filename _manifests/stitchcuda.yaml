name: stitchcuda-kernel-optimization
version: 1.0.0
description: Three-agent orchestration for CUDA kernel synthesis with adaptive replanning
author: Claude Code Workflows
license: MIT
tags:
  - kernel-optimization
  - cuda
  - multi-agent
  - adaptive-replanning
  - planner-coder-verifier

paper:
  title: "StitchCUDA: Three-agent orchestration for CUDA kernel synthesis"
  authors: ["StitchCUDA Team"]
  year: 2024
  arxiv: "2603.02637"
  url: "https://arxiv.org/abs/2603.02637"
  venue: "arXiv preprint"

methodology:
  approach: "Three-agent orchestration: Planner → Coder → Verifier with adaptive replanning"
  topology: "Sequential multi-stage with feedback-driven replanning"

  key_features:
    - "Three specialized agents: Planner, Coder, Verifier"
    - "Adaptive replanning on failure patterns"
    - "KernelBench integration for evaluation"
    - "PyTorch load_inline for fast iteration"
    - "Replan triggers: compile failures, correctness failures, performance stagnation"

  agents:
    - name: "Planner"
      role: "Strategic optimization planning"
      responsibilities:
        - "High-level optimization approach (memory-bound, compute-bound, balanced)"
        - "Decompose into implementation steps"
        - "Specify threading/block configuration"
        - "Identify key optimizations"

      output: "JSON plan with strategies, steps, threading config"

    - name: "Coder"
      role: "CUDA kernel code generation"
      responsibilities:
        - "Generate complete CUDA kernel following plan"
        - "Implement all steps from plan"
        - "Apply key optimizations (coalescing, shared memory, register blocking, etc.)"
        - "PyTorch load_inline compatible format"

      output: "Complete CUDA kernel code + host launch code"

    - name: "Verifier"
      role: "Correctness and performance verification"
      responsibilities:
        - "Compile check (nvcc, syntax, resource usage)"
        - "Correctness check (numerical accuracy vs reference)"
        - "Performance check (benchmark, profile)"
        - "KernelBench evaluation"

      output: "Verification result (pass/fail, performance metrics, errors)"

  replanning:
    triggers:
      - condition: "N consecutive compile failures"
        threshold: 2
        action: "Replan with focus on compilation issues"

      - condition: "N consecutive correctness failures"
        threshold: 2
        action: "Replan with focus on algorithmic correctness"

      - condition: "Performance stagnation (M iterations)"
        threshold: 3
        definition: "Coefficient of variation < 5%"
        action: "Replan with alternative optimization approach"

    strategy:
      - "Diagnose root cause of failures"
      - "Generate alternative approach"
      - "Avoid previous failure modes"
      - "Reset failure counters after replan"

  phases:
    - name: "Setup"
      description: "Initialize CUDA environment, KernelBench, orchestration agents"
      agents: 1

    - name: "Plan"
      description: "Planner generates optimization plan"
      agents: 1
      output: "Optimization plan (JSON)"

    - name: "Code"
      description: "Coder generates CUDA kernel"
      agents: 1
      output: "CUDA kernel code"

    - name: "Verify"
      description: "Verifier checks correctness and performance"
      agents: 1
      output: "Verification result"

    - name: "Replan"
      description: "Adaptive replanning (triggered on failures)"
      agents: 1
      output: "Alternative plan"
      conditional: true

    - name: "Report"
      description: "Generate synthesis report"
      agents: 1

  tools:
    compiler: "NVCC (NVIDIA CUDA Compiler)"
    runtime: "PyTorch load_inline for fast kernel compilation and loading"
    verifier: "KernelBench sandbox evaluation"
    profiler: "nsys, ncu (optional)"
    correctness: "Numerical comparison vs reference implementation"

  feedback_signals:
    - metric: "compilation_success"
      direction: "gate"
      description: "Kernel must compile without errors"

    - metric: "correctness_passed"
      direction: "gate"
      description: "Numerical correctness vs reference"

    - metric: "speedup"
      direction: "higher_better"
      unit: "relative_speedup"
      description: "Speedup vs baseline"
      threshold: 1.0

    - metric: "performance_gflops"
      direction: "higher_better"
      unit: "GFLOPS"
      description: "Sustained throughput"

hardware:
  target: "NVIDIA GPUs (CUDA-capable)"
  architectures:
    - "sm_80 (NVIDIA A100)"
    - "sm_89 (NVIDIA L40S)"
    - "sm_90 (NVIDIA H100)"

  features:
    - "CUDA Compute Capability 8.0+"
    - "Shared memory"
    - "Registers"
    - "Tensor Cores (optional)"

metrics:
  primary: "speedup_vs_baseline"
  secondary:
    - "gflops"
    - "execution_time_ms"
    - "resource_usage (registers, shared memory)"
    - "compilation_success_rate"
    - "correctness_success_rate"

convergence:
  criteria:
    - "Max attempts reached"
    - "Excellent performance achieved (≥2x speedup)"
    - "No improvement in recent attempts"

  max_attempts: 20
  early_termination_speedup: 2.0

workflow_structure:
  entry_point: "stitchcuda-kernel-optimization.js"
  phases: 6
  estimated_runtime: "20-60 minutes (depends on max_attempts)"

results:
  output:
    - "Optimized CUDA kernel"
    - "Performance trajectory (attempt-by-attempt)"
    - "Best plan and strategies"
    - "Replanning events log"
    - "Synthesis report"

  typical_speedup: "1.5x - 5x vs baseline"

usage:
  example: |
    Workflow will:
    1. Initialize CUDA + KernelBench environment
    2. For each attempt (up to max_attempts):
       a. Planner generates optimization plan
       b. Coder generates CUDA kernel
       c. Verifier checks compilation, correctness, performance
       d. If failures trigger replan: adapt strategy
    3. Track best kernel across all attempts
    4. Return best kernel with report

notes:
  - "Three-agent specialization: strategic planning, code generation, verification"
  - "Adaptive replanning: learns from failure patterns"
  - "Fast iteration: PyTorch load_inline for rapid compile-test cycles"
  - "KernelBench integration: standardized evaluation framework"
  - "Failure counters: track consecutive compile/correctness failures"
  - "Stagnation detection: coefficient of variation < 5%"
  - "Early termination: stop when excellent performance achieved"
