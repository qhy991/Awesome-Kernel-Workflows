# =============================================================================
# KernelSkill Manifest — Multi-Agent Dual-Level Memory Kernel Optimization
# =============================================================================
# Source: arXiv:2603.10085 "KernelSkill: A Multi-Agent Framework for GPU
#         Kernel Optimization"
# Code:   https://github.com/0satan0/KernelMem  (CC-BY-4.0)
# Authors: Qitong Sun, Jun Han, Tianlin Li, Zhe Tang, Sheng Chen, Fei Yang,
#          Aishan Liu, Xianglong Liu, Yang Liu
# =============================================================================

source:
  paper_title: "KernelSkill: A Multi-Agent Framework for GPU Kernel Optimization"
  paper_url: "https://arxiv.org/abs/2603.10085"
  paper_venue: "arXiv preprint 2026"
  repo_url: "https://github.com/0satan0/KernelMem"
  commit_or_tag: ""
  license: "CC-BY-4.0"
  notes: >
    Core methodology from the paper + the KernelMem reference implementation
    (main_memory_latest.py). Dual-level memory: a curated long-term expert
    "skill" library (deterministic decision policy + method knowledge) plus
    short-term per-task optimize/repair trajectory memory. Each refinement round
    branches into a repair path (invalid kernel) or an optimize path (valid
    kernel). The long-term skill library is faithful to
    memorybank/bottleneck_headroom_kernelstructure.yaml (machine_check layer).

workflow:
  name: "kernelskill-kernel-optimization"
  description: "Multi-agent CUDA kernel optimization with dual-level memory: curated long-term skill library (deterministic gate + method knowledge) and short-term optimize/repair trajectory memory (KernelSkill methodology)"
  when_to_use: >
    When generating and optimizing custom CUDA kernels from a PyTorch reference and
    you want optimization-method selection to be explicit, auditable, and grounded in
    profiling evidence rather than the model's implicit heuristics. Seeds several
    candidate kernels, then runs a fixed number of refinement rounds; each round either
    REPAIRS an invalid kernel (using chained repair memory to avoid cyclic fixes) or
    OPTIMIZES a valid one (extract features -> deterministic gate -> allowed methods ->
    retrieve skill -> plan -> apply). Best for KernelBench-style operator/model tasks.
  output_filename: "kernelskill-kernel-optimization.js"
  directory: "KernelSkill/"

method:
  category: "iterative_self_improving"
  core_insight: >
    Replace the opaque, implicitly-learned heuristics inside the LLM with explicit,
    externalized "expert optimization skills". A dual-level memory grounds WHAT
    optimization to apply (long-term skill library, auditable) and stabilizes multi-round
    refinement (short-term per-task trajectory + repair-chain memory). Method selection
    is split into a deterministic machine_check gate (screens feasible methods from
    profiling + code evidence -> allowed_methods, a HARD constraint) and a non-binding
    method-knowledge store (rationale + implementation cues) used only AFTER gating.
  feedback_signal:
    type: "throughput_delta"
    description: "speedup = reference (Torch Eager) latency / test latency; ncu memory/SM/occupancy metrics + nsys kernel launch counts drive WHICH method is selected"
    tool: "ncu"
    higher_is_better: true

topology:
  type: "iterative"
  iterative:
    max_iterations_arg: "rounds"
    convergence_condition: "Fixed round budget (paper uses 15); best valid kernel is returned"
    state_variables:
      - name: "bestKernelCode"
        type: "string"
        initial_value: "null"
        description: "Source of the best valid kernel found so far"
      - name: "bestSpeedup"
        type: "number"
        initial_value: "null"
        description: "Best speedup vs Torch eager baseline"
      - name: "baseKernelCode"
        type: "string"
        initial_value: "null"
        description: "Current working kernel that the optimize branch iterates on"
      - name: "currentValid"
        type: "boolean"
        initial_value: "false"
        description: "Whether the current kernel compiles and passes correctness"
      - name: "optMemory"
        type: "array"
        initial_value: "[]"
        description: "Short-term optimization memory: methods tried + measured outcomes"
      - name: "repairChain"
        type: "array"
        initial_value: "[]"
        description: "Chained repair memory for the active repair chain (cleared on success)"
      - name: "skillsApplied"
        type: "array"
        initial_value: "[]"
        description: "Log of skills/methods applied per round with resulting speedups"

phases:
  # --- PREAMBLE ---
  - name: "Setup"
    detail: "Read the PyTorch reference task, establish the eager baseline latency"
    position: "preamble"
    agents:
      - label: "read-reference"
        description: "Read and analyze the PyTorch reference module / operator definition"
        parallelism: "single"
        input_variables: ["REFERENCE_PATH", "TARGET_GPU"]
        output_schema:
          type: "object"
          properties:
            reference_code: { type: "string" }
            op_type: { type: "string" }
            input_shapes: { type: "string" }
            forward_summary: { type: "string" }
            num_operators: { type: "number" }
          required: ["reference_code", "op_type", "forward_summary"]
      - label: "eager-baseline"
        description: "Measure the Torch eager baseline latency for speedup reference"
        parallelism: "single"
        input_variables: ["REFERENCE_PATH", "BENCH_CMD", "WARMUP", "REPEAT", "referenceCode"]
        output_schema:
          type: "object"
          properties:
            baseline_latency_ms: { type: "number" }
            measured: { type: "boolean" }
            notes: { type: "string" }
          required: ["baseline_latency_ms", "measured"]

  - name: "Seed"
    detail: "Generate several candidate CUDA kernels for correctness, pick the best valid seed"
    position: "preamble"
    agents:
      - label: "seed-{i}"
        description: "Generate one correctness-first custom-CUDA implementation of the reference"
        parallelism: "parallel_fan_out"
        parallel_axis: "seedCandidates"
        count_arg: "seed_candidates"
        input_variables: ["referenceCode", "opType", "TARGET_GPU", "TOL"]
        output_schema:
          type: "object"
          properties:
            code: { type: "string" }
            approach: { type: "string" }
            kernels_materialized: { type: "number" }
          required: ["code"]
      - label: "seed-review-{i}"
        description: "Reviewer: compile + correctness check + latency for each seed candidate"
        parallelism: "parallel_fan_out"
        parallel_axis: "seedCandidates"
        input_variables: ["candidate.code", "referenceCode", "BENCH_CMD", "TOL", "baselineLatency"]
        output_schema:
          type: "object"
          properties:
            is_compilable: { type: "boolean" }
            is_correct: { type: "boolean" }
            latency_ms: { type: "number" }
            speedup: { type: "number" }
            error_log: { type: "string" }
          required: ["is_compilable", "is_correct"]

  # --- LOOP BODY ---
  - name: "Evaluate"
    detail: "Compile, verify correctness vs reference, profile with ncu+nsys"
    position: "loop_body"
    agents:
      - label: "review-{round}"
        description: "Reviewer (Compiler + Verifier + Profiler): validity + ncu/nsys profile of the current kernel"
        parallelism: "single"
        input_variables: ["baseKernelCode", "referenceCode", "BENCH_CMD", "NCU_BINARY", "NSYS_BINARY", "TOL", "baselineLatency"]
        output_schema:
          type: "object"
          properties:
            is_compilable: { type: "boolean" }
            is_correct: { type: "boolean" }
            latency_ms: { type: "number" }
            speedup: { type: "number" }
            ncu_metrics: { type: "object" }
            kernel_launch_count: { type: "number" }
            error_log: { type: "string" }
            profile_summary: { type: "string" }
          required: ["is_compilable", "is_correct"]

  - name: "Repair"
    detail: "Invalid branch: Diagnoser -> Repairer using chained repair memory"
    position: "loop_body"
    agents:
      - label: "diagnose-{round}"
        description: "Diagnoser: infer root cause of compile/correctness failure, propose repair plan, avoid cyclic repair via repair-chain memory"
        parallelism: "single"
        input_variables: ["baseKernelCode", "errorLog", "repairChain", "referenceCode"]
        output_schema:
          type: "object"
          properties:
            root_cause: { type: "string" }
            failure_mode: { type: "string" }
            repair_strategy: { type: "string" }
            avoid_repeating: { type: "array", items: { type: "string" } }
          required: ["root_cause", "repair_strategy"]
      - label: "repair-{round}"
        description: "Repairer: apply the repair plan to produce a revised, valid kernel"
        parallelism: "single"
        input_variables: ["baseKernelCode", "diagnosis.root_cause", "diagnosis.repair_strategy", "errorLog"]
        output_schema:
          type: "object"
          properties:
            code: { type: "string" }
            changes_made: { type: "string" }
          required: ["code"]

  - name: "Optimize"
    detail: "Valid branch: extract features -> gate (allowed methods) -> retrieve skill -> plan -> apply"
    position: "loop_body"
    agents:
      - label: "extract-{round}"
        description: "Feature Extractor: derive static code features (hybrid rule + LLM) for the gate"
        parallelism: "single"
        input_variables: ["baseKernelCode", "opType"]
        output_schema:
          type: "object"
          properties:
            kernel_structure_id: { type: "number" }
            has_reuse: { type: "boolean" }
            streaming_no_reuse: { type: "boolean" }
            has_vector_load_store: { type: "boolean" }
            is_pointwise: { type: "boolean" }
            uses_transcendentals: { type: "boolean" }
            is_naive_gemm: { type: "boolean" }
            has_k_loop: { type: "boolean" }
            tc_eligible: { type: "boolean" }
            has_shared_memory_tile: { type: "boolean" }
          required: ["kernel_structure_id"]
      - label: "plan-{round}"
        description: "Planner: run the deterministic gate to get allowed_methods, retrieve method knowledge, select a method, produce a stepwise optimization plan (conditioned on short-term opt memory)"
        parallelism: "single"
        input_variables: ["codeFeatures", "ncuMetrics", "skillLibrary", "optMemory", "headroomTier"]
        output_schema:
          type: "object"
          properties:
            allowed_methods: { type: "array", items: { type: "string" } }
            bottleneck_id: { type: "string" }
            headroom_tier: { type: "string" }
            method_name: { type: "string" }
            rationale: { type: "string" }
            optimization_plan: { type: "string" }
          required: ["method_name", "optimization_plan", "allowed_methods"]
      - label: "optimize-{round}"
        description: "Optimizer: execute the optimization plan on the base kernel"
        parallelism: "single"
        input_variables: ["baseKernelCode", "plan.method_name", "plan.optimization_plan", "plan.rationale"]
        output_schema:
          type: "object"
          properties:
            code: { type: "string" }
            implementation_notes: { type: "string" }
          required: ["code"]

  - name: "Iterate"
    detail: "Update short-term memory and best kernel, advance to the next round"
    position: "loop_body"
    agents: []  # log-only phase

  # --- EPILOGUE ---
  - name: "Report"
    detail: "Final report: best kernel, speedup trajectory, skills applied, repair history"
    position: "epilogue"
    agents:
      - label: "final-report"
        description: "Summarize the best kernel, speedup trajectory, skills/methods applied, and repair history"
        parallelism: "single"
        input_variables: ["bestKernelCode", "bestSpeedup", "skillsApplied", "optMemory", "ROUNDS"]
        output_schema:
          type: "object"
          properties:
            report: { type: "string" }
            speedup_trajectory: { type: "array", items: { type: "number" } }
            skills_summary: { type: "array", items: { type: "string" } }
          required: ["report"]

plan_angles:
  - name: "memory_bandwidth"
    description: "Vectorized/coalesced access, alignment + tail fixes when DRAM/L2 throughput is high"
    trigger: "dram_throughput_pct >= 80 OR l2_throughput_pct >= 80"
  - name: "memory_latency_reuse"
    description: "Shared-memory tiling / register blocking when memory-dependency stalls are high and reuse is possible"
    trigger: "memory_dependency_stall_high AND reuse_possible"
  - name: "occupancy"
    description: "Address register/shared-mem/warp occupancy limiters to improve latency hiding"
    trigger: "achieved_occupancy_pct low AND primary_limiter_util_pct < 60"
  - name: "compute_specialization"
    description: "Tensor cores / cuBLASLt for GEMM-like K-loops; instruction-mix tuning for SFU-heavy kernels"
    trigger: "tc_eligible AND (is_naive_gemm OR is_gemm_kloop OR has_k_loop)"
  - name: "kernel_fusion"
    description: "Fuse multiple kernels / use CUDA graphs when kernel_launch_count is high"
    trigger: "kernel_launch_count > 1 OR cudagraph_eligible"

args:
  required:
    - name: "reference_path"
      type: "string"
      description: "Path to the PyTorch reference task (.py with Model + get_inputs/get_init_inputs)"
      example: "/path/to/KernelBench/level1/19_ReLU.py"
  optional:
    - name: "op_description"
      type: "string"
      default: "'PyTorch operator/model'"
      description: "Human-readable description of the target operation"
      example: "ReLU activation over a large tensor"
    - name: "target_gpu"
      type: "string"
      default: "'A100-80GB'"
      description: "Target GPU architecture for prompts and profiling"
      example: "A100-80GB"
    - name: "rounds"
      type: "number"
      default: "15"
      description: "Number of refinement rounds (paper uses 15)"
      example: "15"
    - name: "seed_candidates"
      type: "number"
      default: "3"
      description: "Number of correctness-first seed kernels generated up front"
      example: "3"
    - name: "skill_library_path"
      type: "string"
      default: "''"
      description: "Path to a long-term skill library YAML/JSON. If set, OVERRIDES the embedded skill library (long-term memory). Faithful to memorybank/bottleneck_headroom_kernelstructure.yaml"
      example: "/path/to/skill_library.yaml"
    - name: "bench_command"
      type: "string"
      default: "''"
      description: "Command to compile + benchmark a generated kernel vs the reference"
      example: "python utils/compile_and_run.py --kernel"
    - name: "ncu_binary"
      type: "string"
      default: "'ncu'"
      description: "Path to the Nsight Compute binary (profiler)"
      example: "ncu"
    - name: "nsys_binary"
      type: "string"
      default: "'nsys'"
      description: "Path to the Nsight Systems binary (kernel launch counts)"
      example: "nsys"
    - name: "tol"
      type: "number"
      default: "0.01"
      description: "Max |err| tolerated in the correctness check vs reference"
      example: "0.01"
    - name: "warmup"
      type: "number"
      default: "25"
      description: "Warm-up iterations for benchmarking"
      example: "25"
    - name: "repeat"
      type: "number"
      default: "100"
      description: "Timed iterations per benchmark"
      example: "100"
    - name: "exp_dir"
      type: "string"
      default: "'/tmp/kernelskill_exp'"
      description: "Directory for kernels, profiles, and memory snapshots"
      example: "/path/to/experiment/output"
    - name: "run_timestamp_iso"
      type: "string"
      default: "'unknown'"
      description: "ISO timestamp for report metadata (runtime has no Date access)"
      example: "2026-06-02T15:00:00+08:00"

correctness:
  criteria:
    - "Generated kernel output matches the PyTorch reference within tol across the task inputs"
    - "Kernel compiles cleanly (Compiler) and runs without crashes"
    - "All operators in the reference forward are covered"
    - "No race conditions / out-of-bounds in custom CUDA"
  check_type: "runtime_comparison"
  reference_output: "Run the PyTorch reference module on the same inputs (KernelBench validation)"

return_fields:
  - name: "baseline_latency_ms"
    type: "number"
    description: "Torch eager baseline latency"
    required: true
  - name: "best_speedup"
    type: "number"
    description: "Best speedup vs Torch eager achieved"
    required: true
  - name: "best_kernel_code"
    type: "string"
    description: "Source of the best valid kernel"
    required: true
  - name: "rounds_completed"
    type: "number"
    description: "Number of refinement rounds executed"
    required: true
  - name: "skills_applied"
    type: "array"
    description: "Per-round log of methods applied + resulting speedups"
    required: true
  - name: "speedup_trajectory"
    type: "array"
    description: "Best speedup after each round"
    required: true
  - name: "opt_memory"
    type: "array"
    description: "Short-term optimization memory (methods tried + outcomes)"
    required: true
  - name: "report"
    type: "string"
    description: "Final technical report"
    required: true

template:
  base: "iterative-loop"
  customizations:
    - "dual_memory"
    - "skill_library"
    - "deterministic_gate"
    - "repair_branch"
    - "seed_phase"
    - "ncu_profiling"
