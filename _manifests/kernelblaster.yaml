# =============================================================================
# KernelBlaster Manifest — Memory-Augmented In-Context RL (MAIC-RL)
# =============================================================================
# Source: arXiv:2602.14293 "KernelBlaster: Continual Cross-Task CUDA Optimization
#         via Memory-Augmented In-Context Reinforcement Learning"
# Code:   https://github.com/NVlabs/KernelBlaster  (Apache-2.0)
# Authors: Kris Shengjun Dong, Sahil Modi, Dima Nikiforov, Sana Damani,
#          Edward Lin, Siva Kumar Sastry Hari, Christos Kozyrakis
# =============================================================================

source:
  paper_title: "KernelBlaster: Continual Cross-Task CUDA Optimization via Memory-Augmented In-Context Reinforcement Learning"
  paper_url: "https://arxiv.org/abs/2602.14293"
  paper_venue: "arXiv 2026 (NVIDIA / UC Berkeley / Stanford)"
  repo_url: "https://github.com/NVlabs/KernelBlaster"
  commit_or_tag: ""
  license: "Apache-2.0"
  notes: >
    Core methodology (MAIC-RL): profile-guided RL rollouts that classify each kernel
    into a hardware performance state, retrieve the best-known optimization for that
    state from a PERSISTENT, state-keyed knowledge base, apply it, measure the real
    reward (Elapsed Cycles delta via NCU), and update the database. The knowledge base
    persists across kernels and runs, yielding RL-style improvement without per-task
    LM finetuning. Data structures faithful to data/kernelblaster/optimization_database.json
    and src/kernelblaster/agents/{opt_ncu_rl,rl_agents,database}.py.

workflow:
  name: "kernelblaster-kernel-optimization"
  description: "Memory-augmented in-context RL loop for CUDA kernel optimization with a persistent, state-keyed optimization knowledge base (KernelBlaster / MAIC-RL methodology)"
  when_to_use: >
    When you want to optimize a CUDA kernel via profile-guided RL rollouts that ACCUMULATE
    experience across kernels and runs. KernelBlaster classifies each kernel into a hardware
    performance state (memory / compute / latency bound), retrieves the best-known optimization
    for that state from a persistent knowledge base keyed by bottleneck pattern, applies it,
    measures the real reward (Elapsed Cycles delta via NCU), and updates the database so future
    rollouts and future kernels reuse what worked. Pass optimization_db_path to carry the
    knowledge base across invocations.
  output_filename: "kernelblaster-kernel-optimization.js"
  directory: "KernelBlaster/"

method:
  category: "iterative_self_improving"
  core_insight: >
    Most agentic CUDA-optimization loops forget what they learned from earlier kernels and
    earlier rollouts, leading to repeated mistakes and biased sampling. KernelBlaster maintains
    a persistent, structured CUDA optimization knowledge base that stores the actual measured
    performance of optimizations keyed by kernel "state" (bottleneck pattern), and reuses that
    experience to bias the search toward high-payoff strategies. This yields RL-style improvement
    (reward = measured cycle reduction, accuracy bonus, degradation penalty) across tasks without
    expensive per-task LM finetuning.
  feedback_signal:
    type: "profiler_metric"
    description: "NCU Elapsed Cycles (primary scalar). actual_improvement% = (prev_cycles - new_cycles) / prev_cycles * 100; reward = improvement/100 + prediction-accuracy bonus +/- degradation penalty"
    tool: "ncu"
    higher_is_better: false  # fewer cycles = better

topology:
  type: "iterative"
  iterative:
    max_iterations_arg: "rollout_steps"
    convergence_condition: "Stop a rollout early on severe degradation (actual_improvement < -20%) or when no unused optimization remains for the current state"
    state_variables:
      - name: "optimizationDb"
        type: "object"
        initial_value: "null"
        description: "Persistent state-keyed knowledge base: known_states + optimization_strategies (technique, confidence_score, usage_count, actual_speedup, predicted_improvement)"
      - name: "replayBuffer"
        type: "array"
        initial_value: "[]"
        description: "Trajectories from rollouts; each trajectory is a list of TrajectoryStep {state, action, cycles, predicted_improvement, actual_improvement, reward}"
      - name: "bestCycles"
        type: "number"
        initial_value: "null"
        description: "Best (lowest) Elapsed Cycles achieved so far"
      - name: "bestKernelCode"
        type: "string"
        initial_value: "null"
        description: "Source of the best kernel variant"
      - name: "baselineCycles"
        type: "number"
        initial_value: "null"
        description: "Initial kernel Elapsed Cycles (set once in Setup)"
      - name: "currentState"
        type: "string"
        initial_value: "null"
        description: "Current hardware performance state id (memory_bandwidth_limited / compute_throughput_limited / latency_occupancy_limited)"

phases:
  # --- PREAMBLE ---
  - name: "Setup"
    detail: "Read kernel, load/seed the persistent optimization DB, NCU-profile baseline, classify initial state"
    position: "preamble"
    agents:
      - label: "read-baseline"
        description: "Read and analyze the CUDA kernel"
        parallelism: "single"
        input_variables: ["KERNEL_PATH"]
        output_schema:
          type: "object"
          properties:
            kernel_code: { type: "string" }
            op_type: { type: "string" }
            key_functions: { type: "array", items: { type: "string" } }
            current_approach: { type: "string" }
          required: ["kernel_code", "op_type"]
      - label: "profile-classify-baseline"
        description: "NCU-profile the baseline (Elapsed Cycles + SOL metrics) and classify into a performance state"
        parallelism: "single"
        input_variables: ["NCU_BINARY", "EXP_DIR", "KERNEL_PATH", "KERNEL_NAME_REGEX", "HARNESS_BUILD_CMD", "HARNESS_RUN_ARGS", "baselineKernel", "stateTaxonomy"]
        output_schema:
          type: "object"
          properties:
            elapsed_cycles: { type: "number" }
            memory_throughput_pct: { type: "number" }
            compute_throughput_pct: { type: "number" }
            achieved_occupancy_pct: { type: "number" }
            state_id: { type: "string" }
            primary_bottleneck: { type: "string" }
            state_rationale: { type: "string" }
            profile_summary: { type: "string" }
            ncu_available: { type: "boolean" }
          required: ["elapsed_cycles", "state_id", "primary_bottleneck", "profile_summary"]

  # --- LOOP BODY (one rollout = many steps) ---
  - name: "Retrieve"
    detail: "Match the current state against the knowledge base; select the best optimization (by confidence x predicted speedup, penalizing usage)"
    position: "loop_body"
    agents:
      - label: "retrieve-{rollout}-{step}"
        description: "Rank the candidate optimizations for the current state and recommend one, citing prior measured payoff"
        parallelism: "single"
        input_variables: ["currentState", "stateStrategies", "usedTechniques", "lastNcuLog", "currentKernelCode"]
        output_schema:
          type: "object"
          properties:
            technique: { type: "string" }
            predicted_improvement: { type: "number" }
            rationale: { type: "string" }
            implementation_guidance: { type: "string" }
          required: ["technique", "predicted_improvement", "rationale"]

  - name: "Execute"
    detail: "Apply the selected optimization to the current kernel (strategy-guided prompt)"
    position: "loop_body"
    agents:
      - label: "apply-{rollout}-{step}"
        description: "Implement the selected technique as a complete, compilable CUDA kernel"
        parallelism: "single"
        input_variables: ["currentKernelCode", "selectedTechnique", "implementationGuidance", "lastNcuLog"]
        output_schema:
          type: "object"
          properties:
            code: { type: "string" }
            applied_notes: { type: "string" }
          required: ["code"]

  - name: "Evaluate"
    detail: "Compile, verify correctness against the driver, NCU-profile; compute Elapsed Cycles, actual_improvement, reward, new state"
    position: "loop_body"
    agents:
      - label: "eval-{rollout}-{step}"
        description: "Static correctness + compile + NCU profile; report cycles and the resulting state"
        parallelism: "single"
        input_variables: ["candidateCode", "prevCycles", "EXP_DIR", "HARNESS_BUILD_CMD", "NCU_BINARY", "KERNEL_NAME_REGEX", "HARNESS_RUN_ARGS", "stateTaxonomy"]
        output_schema:
          type: "object"
          properties:
            is_correct: { type: "boolean" }
            is_compilable: { type: "boolean" }
            elapsed_cycles: { type: "number" }
            new_state_id: { type: "string" }
            ncu_comparison: { type: "string" }
            correctness_issues: { type: "array", items: { type: "string" } }
          required: ["is_correct", "is_compilable", "elapsed_cycles"]

  - name: "Update"
    detail: "Compute reward, append TrajectoryStep, update DB entry (usage_count, actual_speedup, confidence), advance state"
    position: "loop_body"
    agents: []  # deterministic in-workflow update (reward function + DB mutation)

  # --- EPILOGUE ---
  - name: "Learn"
    detail: "Periodic policy-update cycle: evaluate the replay buffer, summarize which techniques over/under-perform, adjust DB confidence"
    position: "epilogue"
    agents:
      - label: "policy-update"
        description: "Analyze recent trajectories vs DB predictions and recommend confidence/ordering adjustments"
        parallelism: "single"
        input_variables: ["replayBuffer", "bufferStats", "dbStats"]
        output_schema:
          type: "object"
          properties:
            analysis: { type: "string" }
            confidence_updates: { type: "array", items: { type: "object" } }
          required: ["analysis"]

  - name: "Report"
    detail: "Final report: best kernel, cycle reduction, DB growth, trajectory of states and rewards"
    position: "epilogue"
    agents:
      - label: "final-report"
        description: "Summarize the optimization trajectory, the state transitions, and the updated knowledge base"
        parallelism: "single"
        input_variables: ["baselineCycles", "bestCycles", "replayBuffer", "optimizationDb", "bestKernelCode"]
        output_schema:
          type: "object"
          properties:
            report: { type: "string" }
          required: ["report"]

plan_angles:
  - name: "memory_bound_state"
    description: "memory_bandwidth_limited: vectorized access, coalescing, shared-memory tiling, data-layout transformation"
    trigger: "primary_bottleneck == memory_bound (high DRAM/L2 throughput, uncoalesced access)"
  - name: "compute_bound_state"
    description: "compute_throughput_limited: tensor cores, instruction-mix balancing, functional-unit utilization, algorithmic change"
    trigger: "primary_bottleneck == compute_bound (high SM throughput, saturated ALU/SFU)"
  - name: "latency_bound_state"
    description: "latency_occupancy_limited: increase occupancy, more parallelism, reduce synchronization, thread coarsening"
    trigger: "primary_bottleneck == latency_bound (neither memory nor compute saturated, low occupancy)"

args:
  required:
    - name: "kernel_path"
      type: "string"
      description: "Path to the target CUDA kernel file (.cu) — KernelBench-CUDA init.cu"
      example: "/path/to/init.cu"
  optional:
    - name: "op_description"
      type: "string"
      default: "'CUDA kernel'"
      description: "Human-readable description of the kernel's operation"
      example: "Square matrix multiplication"
    - name: "optimization_db_path"
      type: "string"
      default: "''"
      description: "Path to a persistent optimization knowledge base JSON. Loaded at Setup, written back after the run — this is the cross-task memory."
      example: "/path/to/optimization_database.json"
    - name: "harness_build_cmd"
      type: "string"
      default: "''"
      description: "Command to build the kernel/driver harness (KernelBench-CUDA driver.cpp + init.cu)"
      example: "nvcc -O3 -lineinfo -arch=sm_89 -o bench driver.cpp init.cu"
    - name: "harness_run_args"
      type: "string"
      default: "''"
      description: "Runtime arguments for the harness binary"
      example: ""
    - name: "kernel_name_regex"
      type: "string"
      default: "''"
      description: "Regex for ncu -k to select the target kernel"
      example: "matmul_kernel"
    - name: "ncu_binary"
      type: "string"
      default: "'ncu'"
      description: "Path to the Nsight Compute binary"
      example: "ncu"
    - name: "exp_dir"
      type: "string"
      default: "'/tmp/kernelblaster_exp'"
      description: "Directory for NCU reports and experiment outputs"
      example: "/path/to/experiment/output"
    - name: "rl_iterations"
      type: "number"
      default: "3"
      description: "Number of rollouts (trajectories) to run"
      example: "5"
    - name: "rollout_steps"
      type: "number"
      default: "4"
      description: "Maximum optimization steps per rollout"
      example: "5"
    - name: "update_frequency"
      type: "number"
      default: "3"
      description: "Run a policy-update (Learn) cycle every N trajectories"
      example: "3"
    - name: "buffer_size"
      type: "number"
      default: "100"
      description: "Maximum number of trajectories retained in the replay buffer"
      example: "1000"
    - name: "gpu_type"
      type: "string"
      default: "'L40S'"
      description: "Target GPU architecture for optimization hints"
      example: "L40S"
    - name: "test_command"
      type: "string"
      default: "''"
      description: "Fallback correctness command when NCU/driver is unavailable"
      example: "python test_kernel.py"
    - name: "benchmark_command"
      type: "string"
      default: "''"
      description: "Fallback benchmark command when NCU is unavailable"
      example: "python bench_kernel.py"
    - name: "run_timestamp_iso"
      type: "string"
      default: "'unknown'"
      description: "ISO timestamp for report headers (runtime has no Date access)"
      example: "2026-06-02T17:00:00+08:00"

correctness:
  criteria:
    - "Same numerical output as the reference within tolerance (validated by the KernelBench-CUDA driver)"
    - "Compiles cleanly with the provided build command"
    - "No race conditions or out-of-bounds access"
    - "Final LM soft-verification before emitting the best kernel"
  check_type: "runtime_comparison"
  reference_output: "Run the driver.cpp harness on the reference inputs"

return_fields:
  - name: "baseline_cycles"
    type: "number"
    description: "Initial Elapsed Cycles from NCU"
    required: true
  - name: "best_cycles"
    type: "number"
    description: "Best Elapsed Cycles after optimization"
    required: true
  - name: "overall_speedup"
    type: "number"
    description: "baseline_cycles / best_cycles"
    required: true
  - name: "rollouts_completed"
    type: "number"
    description: "Number of rollouts executed"
    required: true
  - name: "trajectory_count"
    type: "number"
    description: "Trajectories stored in the replay buffer"
    required: true
  - name: "optimization_db"
    type: "object"
    description: "Final state of the persistent knowledge base (also written to optimization_db_path)"
    required: true
  - name: "best_kernel_code"
    type: "string"
    description: "Source of the final best kernel"
    required: true
  - name: "report"
    type: "string"
    description: "Final technical report"
    required: true

template:
  base: "iterative-loop"
  customizations:
    - "ncu_profiling"
    - "state_keyed_db"
    - "replay_buffer"
    - "cross_task_memory"
    - "reward_function"
    - "early_stopping"
