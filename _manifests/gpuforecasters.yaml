name: gpuforecasters-kernel-optimization
version: 1.0.0
description: Selective surrogate optimization with learned speedup forecasting
author: Claude Code Workflows
license: MIT
tags:
  - kernel-optimization
  - surrogate-model
  - puct-search
  - speedup-forecasting
  - abstain-mechanism
  - cuda

paper:
  title: "GPU Forecasters: Selective surrogate optimization with learned speedup forecasting"
  authors: ["GPU Forecasters Team"]
  year: 2024
  arxiv: "2605.31464"
  url: "https://arxiv.org/abs/2605.31464"
  venue: "arXiv preprint"

methodology:
  approach: "PUCT search with learned LM speedup forecaster and native abstain mechanism"
  topology: "Tree search with selective surrogate evaluation"

  key_features:
    - "Learned speedup forecaster: LM predicts relative speedup (8 ordinal bins)"
    - "Native abstain: forecaster can defer to actual GPU execution when uncertain"
    - "PUCT search: balance exploration (high uncertainty) and exploitation (high predicted speedup)"
    - "Fixed GPU iterations: M actual evaluations across entire search"
    - "Curriculum training: train forecaster on initial generations, apply in later generations"
    - "Ordinal classification: speedup bins (e.g., [0.5x, 0.7x, 0.9x, 1.0x, 1.2x, 1.5x, 2.0x, 3.0x+])"

  phases:
    - name: "Setup"
      description: "Initialize GPU environment, baseline kernel, forecaster model, search tree"
      agents: 1

    - name: "Train Forecaster"
      description: "Train speedup forecaster on initial data (curriculum phase)"
      agents: 1
      substeps:
        - "Generate initial kernel candidates (random or seeded)"
        - "Execute on GPU (ground truth speedup)"
        - "Train forecaster: kernel code + context → speedup bin"
        - "Validate forecaster: accuracy, abstain rate"

      training_data: "Initial N kernels (e.g., N=50-100)"

    - name: "PUCT Search"
      description: "Tree search with forecaster-guided exploration"
      agents: 1
      substeps:
        - "For each search step:"
        - "  1. Select node: PUCT = speedup_estimate + C * sqrt(log(N_parent) / N_node)"
        - "  2. Generate child candidates (mutations, variations)"
        - "  3. Forecast speedup: LM predicts bin or abstains"
        - "  4. If abstain or high uncertainty: execute on GPU (use iterations)"
        - "  5. If predict: use forecasted speedup (no GPU cost)"
        - "  6. Update tree statistics"
        - "Repeat until GPU iterations exhausted"

      puct_formula: "PUCT(node) = Q(node) + C * sqrt(log(N_parent) / N_node)"
      gpu_budget: "M evaluations (e.g., M=100-500)"

    - name: "Evaluate"
      description: "Evaluate top candidates from search tree on GPU"
      agents: 1

    - name: "Report"
      description: "Generate optimization report with search trajectory and forecaster analysis"
      agents: 1

  tools:
    gpu: "NVIDIA CUDA GPUs"
    compiler: "NVCC (NVIDIA CUDA Compiler)"
    forecaster: "Transformer LM (fine-tuned for speedup prediction)"
    search: "PUCT tree search"
    correctness: "Numerical validation vs reference"

  feedback_signals:
    - metric: "forecasted_speedup_bin"
      direction: "higher_better"
      unit: "ordinal_bin"
      description: "LM forecasts speedup in 8 ordinal bins"
      bins: [0.5, 0.7, 0.9, 1.0, 1.2, 1.5, 2.0, 3.0]

    - metric: "actual_speedup"
      direction: "higher_better"
      unit: "relative_speedup"
      description: "Ground truth speedup from GPU execution"

    - metric: "abstain_decision"
      direction: "higher_confidence_abstain_less"
      description: "Forecaster abstains when uncertain (defer to GPU)"

    - metric: "puct_score"
      direction: "higher_better"
      description: "PUCT = exploitation + exploration"

  forecaster:
    architecture: "Transformer LM (e.g., CodeLlama, GPT-based)"
    input: "Kernel code + context (operation, shapes, dtypes)"
    output: "8-bin ordinal classification + abstain option"
    training: "Supervised on (kernel, actual_speedup) pairs"
    abstain_mechanism: "Uncertainty threshold → defer to GPU"

  puct_search:
    formula: "PUCT(node) = Q(node) + C * sqrt(log(N_parent) / N_node)"
    components:
      Q: "Average speedup of subtree"
      C: "Exploration constant (tunable, e.g., C=2)"
      N_parent: "Parent node visit count"
      N_node: "Current node visit count"

    iterations: "M GPU evaluations total"
    abstain_usage: "Abstain → consume 1 GPU eval"
    predict_usage: "Predict → no GPU cost"

hardware:
  target: "NVIDIA GPUs (CUDA-capable)"
  architectures:
    - "sm_80 (NVIDIA A100)"
    - "sm_89 (NVIDIA L40S)"
    - "sm_90 (NVIDIA H100)"

  features:
    - "CUDA Compute Capability 8.0+"
    - "Tensor Cores (optional)"

metrics:
  primary: "best_speedup_found"
  secondary:
    - "gpu_budget_efficiency (best_speedup / num_gpu_evals)"
    - "forecaster_accuracy"
    - "abstain_rate"
    - "search_tree_depth"
    - "search_tree_breadth"

convergence:
  criteria:
    - "GPU iterations exhausted (M evaluations)"
    - "Search tree fully explored"
    - "No improvement in top-K nodes for N iterations"

  typical_gpu_budget: 100-500
  typical_forecaster_accuracy: "60-80% (ordinal bins)"

workflow_structure:
  entry_point: "gpuforecasters-kernel-optimization.js"
  phases: 5
  estimated_runtime: "30-120 minutes (depends on GPU iterations)"

results:
  output:
    - "Optimized CUDA kernel"
    - "Search tree trajectory"
    - "Forecaster performance analysis (accuracy, abstain rate)"
    - "GPU iterations usage breakdown"
    - "Best kernel vs baseline comparison"

  typical_speedup: "1.5x - 4x vs baseline"

usage:
  example: |
    Workflow will:
    1. Train speedup forecaster on initial kernels (curriculum phase)
    2. PUCT search with forecaster guidance:
       - Select promising nodes (high PUCT score)
       - Forecast speedup or abstain
       - Use GPU iterations selectively
    3. Evaluate top candidates
    4. Return best kernel with analysis

notes:
  - "Selective surrogate: forecaster defers to GPU when uncertain (abstain mechanism)"
  - "PUCT search: balances exploration (uncertainty) and exploitation (predicted speedup)"
  - "Ordinal bins: speedup is discretized into 8 categories for classification"
  - "Fixed GPU iterations: M evaluations across entire search (not per-generation)"
  - "Curriculum training: train forecaster on initial data, apply in later search"
  - "Abstain rate: key metric for forecaster quality (too high → wastes iterations; too low → poor guidance)"
  - "GPU iterations efficiency: best_speedup / num_gpu_evals (higher is better)"
