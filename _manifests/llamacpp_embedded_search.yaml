source:
  paper_title: "AKW design note: multi-variant embedded-kernel search for llama.cpp"
  paper_url: ""
  paper_venue: "AKW design notes 2026"
  repo_url: ""
  commit_or_tag: ""
  license: "MIT"
  notes: >
    Companion to in-place-patch-optimization. Where InPlacePatch iterates a single
    on-disk kernel file with small Edits, this workflow fans out N independent
    full-kernel designs in parallel. Each variant is written as a new .cuh file,
    wired into llama.cpp's fattn.cu dispatch system via the register script, and
    evaluated by the project's own build/test/bench commands -- gated by an
    ENV var (KERSOR_VARIANT) so default dispatch is unaffected. After ranking,
    losing variants are unregistered byte-exact and only the winner is reported.

workflow:
  name: "llamacpp-embedded-search"
  description: "Fan-out search across complete new kernel variants embedded in llama.cpp ggml-cuda dispatch"
  when_to_use: >
    Use when (a) the kernel cannot be compiled standalone (depends on project
    headers / template instantiation / dispatch table), AND (b) the bottleneck is
    structural enough that small in-place patches cannot bridge it -- you need to
    try genuinely different kernel designs (split-K vs split-Q, different tile
    shapes, different GQA pack strategies) and pick the best. Each subagent
    writes a complete new .cuh; the workflow handles dispatch registration,
    project build, correctness, benchmark, unregister.
  output_filename: "llamacpp-embedded-search.js"
  directory: "LlamacppEmbeddedSearch/"

inputs:
  supports_existing_kernel: true
  supports_problem_definition: false
  required_one_of:
    - reference_cuh
  generation:
    enabled: false
  required_args:
    - ggml_root
    - register_script
    - build_command
    - test_command
    - benchmark_command
    - reference_cuh
  optional_args:
    - n_variants
    - max_rounds
    - target_speedup
    - correctness_regex
    - latency_regex
    - latency_unit
    - tolerance
    - op_description
    - handoff_context
    - workload_axes
    - dkq
    - dv
    - variants_dir
    - exp_dir

method:
  category: "fan_out_search"
  core_insight: >
    Treat each candidate kernel as a brand new file plus a dispatch-table entry,
    rather than as a patch to a single live file. This lets a single round
    evaluate N structurally distinct designs (the proposals are drafted in
    parallel by N subagents) at the cost of one extra register/unregister round
    trip per variant. Project build is still serial -- evaluation is serial per
    variant -- but proposals are fan-out, so wall-clock per variant is roughly
    (proposal_p99 / N) + (build + test + bench).
  feedback_signal:
    type: throughput_delta
    description: >
      aggregate_latency parsed out of the project benchmark stdout (geomean
      across workload rows when multiple are reported), compared to baseline
      latency measured with all variants unregistered.
    tool: "project benchmark_command (verbatim, with KERSOR_VARIANT=<name> prefix)"
    higher_is_better: false

topology:
  type: fan_out_then_serial_eval
  iterative:
    iterations_arg: "max_rounds"
    convergence_condition: "bestSpeedup >= target_speedup"
    mutable_state:
      - bestSpeedup
      - bestLatency
      - bestVariantName
      - bestCuhPath
      - history

backends: ["cuda", "rocm"]
fidelity_boundary: "strict_high_fidelity"

execution:
  parallelism: "N parallel proposals per round; SERIAL register/build/test/bench/unregister per variant"
  proposal_strategy: "N independent subagents each author a complete new .cuh file"
  revert_strategy: >
    Per-variant: unregister on any failure (build/correctness/bench) and on
    non-improving variants. Final winner is also unregistered before report --
    the caller (KerSor session) decides whether to re-register the kept variant
    via the best-kernel/ artifact. fattn.cu always returns to byte-exact pristine
    when the run ends (verified by md5sum in scripts/llamacpp_register_variant.py).

grounding:
  enforced: true
  contract: "inlined GROUNDING_INSTRUCTION (mirrors _substrate/grounding.js)"
  rationale: >
    Every numeric (build duration, correctness PASS/FAIL, aggregate_latency) is
    keyed to a real Bash invocation. Subagents return grounded=false when a
    command fails or a tool is missing, instead of fabricating a value.

outputs:
  speedup_field: "speedup"
  best_kernel_field: "best_kernel_code"
  history_field: "history"
  side_effects:
    - "Writes one .cuh per drafted variant into variants_dir (or exp_dir/variants/)"
    - "Temporarily mutates ggml/src/ggml-cuda/fattn.cu during evaluation (markered insertions)"
    - "Creates temporary template-instances/*.cu files; deletes them on unregister"
    - "Restores fattn.cu to byte-exact pristine state at run end"
