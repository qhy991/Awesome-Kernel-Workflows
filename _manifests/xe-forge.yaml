name: xe-forge-kernel-optimization
version: 1.0.0
description: Multi-stage CoVeR optimization for Intel XPU Triton kernels
author: Claude Code Workflows
license: MIT
tags:
  - kernel-optimization
  - triton
  - intel-xpu
  - cover-loop
  - multi-stage
  - vtune

paper:
  title: "Xe-Forge: LLM-driven Triton kernel optimization for Intel XPUs"
  authors: ["Intel Research"]
  year: 2024
  url: "https://github.com/intel/Xe-Forge"
  venue: "GitHub Project"

methodology:
  approach: "Multi-stage CoVeR (Code-Verify-Refine) optimization"
  topology: "Sequential multi-stage pipeline with nested CoVeR loops"

  key_features:
    - "11 optimization stages (ALGORITHMIC → DISCOVERY → DTYPE_FIX → FUSION → MEMORY_ACCESS → BLOCK_POINTERS → PERSISTENT_KERNEL → DEVICE_SPECIFIC → AUTOTUNING → POLISHING → VECTORIZATION)"
    - "CoVeR loop per stage: generate → verify → refine with best-of tracking"
    - "Hard-ordered stage dependencies (algorithmic < dtype < fusion < device-specific < autotuning)"
    - "≥2% improvement gate between stages"
    - "Intel XPU (Arc Pro, Ponte Vecchio) targeting"
    - "VTune GPU profiling integration"

  stages:
    - name: "ALGORITHMIC"
      description: "High-level algorithm selection and data flow optimization"
      focus: "Algorithm correctness, numerical stability"

    - name: "DISCOVERY"
      description: "Explore broad optimization space, discover promising directions"
      focus: "Exploratory optimization, pattern discovery"

    - name: "DTYPE_FIX"
      description: "Data type selection and mixed precision optimization"
      focus: "fp32/fp16/bf16 selection, type conversions"

    - name: "FUSION"
      description: "Operation fusion, epilogue fusion"
      focus: "Reduce kernel launches, minimize memory traffic"

    - name: "MEMORY_ACCESS"
      description: "Memory access pattern optimization"
      focus: "Coalescing, bank conflicts, global memory efficiency"

    - name: "BLOCK_POINTERS"
      description: "Triton block pointer optimization"
      focus: "Efficient pointer arithmetic, block-level addressing"

    - name: "PERSISTENT_KERNEL"
      description: "Persistent kernel patterns for streaming workloads"
      focus: "Reduce kernel launch overhead, increase occupancy"

    - name: "DEVICE_SPECIFIC"
      description: "Intel XPU-specific optimizations"
      focus: "XMX (Xe Matrix Extensions), EU (Execution Unit) optimization"

    - name: "AUTOTUNING"
      description: "Auto-tune tile sizes, block dimensions, launch parameters"
      focus: "Grid search or heuristic search for optimal parameters"

    - name: "POLISHING"
      description: "Final code cleanup, minor tweaks"
      focus: "Code quality, readability, minor performance tweaks"

    - name: "VECTORIZATION"
      description: "Vectorization and SIMD optimization"
      focus: "Maximize vector instruction usage"

  phases:
    - name: "Setup"
      description: "Initialize Intel XPU environment, Triton compiler, VTune profiling"
      agents: 1

    - name: "Stage Loop"
      description: "For each stage, run CoVeR loop until convergence or max iterations"
      agents: "Variable (LLM generator + verification tool)"
      substeps:
        - "Generate candidate optimization (LLM)"
        - "Verify: compile + correctness + performance (automated tools)"
        - "Track best-in-stage (≥2% improvement gate)"
        - "Repeat for max_iterations_per_stage"
        - "Promote best-in-stage to next stage baseline"

    - name: "Report"
      description: "Generate optimization report with stage-by-stage breakdown"
      agents: 1

  tools:
    compiler: "Intel Triton compiler for XPU"
    verifier: "Triton compiler + XPU runtime"
    profiler: "Intel VTune GPU profiling"
    correctness: "torch.allclose or equivalent numerical comparison"

  feedback_signals:
    - metric: "speedup"
      direction: "higher_better"
      unit: "relative_speedup"
      description: "Wall-clock speedup vs baseline"

    - metric: "correctness"
      direction: "gate"
      description: "Numerical correctness (absolute/relative error threshold)"

    - metric: "improvement_gate"
      direction: "threshold"
      threshold: 2.0
      unit: "percent"
      description: "Minimum improvement to accept new candidate (≥2%)"

hardware:
  target: "Intel XPU (Arc Pro A-series, Ponte Vecchio)"
  architectures:
    - "Intel Arc Pro A40/A50/A60"
    - "Intel Data Center GPU Max (Ponte Vecchio)"

  features:
    - "XMX (Xe Matrix Extensions)"
    - "EU (Execution Units)"
    - "Shared Local Memory"
    - "HBM (Ponte Vecchio)"

metrics:
  primary: "speedup_vs_baseline"
  secondary:
    - "execution_time_ms"
    - "gflops"
    - "memory_bandwidth_utilization"
    - "eu_occupancy"
    - "xmx_utilization"

convergence:
  criteria:
    - "No ≥2% improvement in CoVeR loop for N iterations"
    - "Max iterations per stage reached"
    - "Compilation or correctness failure"

  typical_iterations_per_stage: 5-10
  total_stages: 11

workflow_structure:
  entry_point: "xe-forge-kernel-optimization.js"
  phases: 13
  estimated_runtime: "30-90 minutes (depends on kernel complexity)"

results:
  output:
    - "Optimized Triton kernel for Intel XPU"
    - "Stage-by-stage performance progression"
    - "VTune profiling data"
    - "Optimization report"

  typical_speedup: "1.5x - 5x vs naive Triton baseline"

usage:
  example: |
    Workflow will:
    1. Initialize Intel XPU + Triton environment
    2. Load baseline kernel
    3. For each stage (ALGORITHMIC → ... → VECTORIZATION):
       a. Generate optimized candidates (LLM)
       b. Verify correctness + performance
       c. Track best-in-stage (≥2% gate)
    4. Return best kernel across all stages

notes:
  - "Hard stage ordering: early stages (ALGORITHMIC, DTYPE_FIX) must complete before later stages (DEVICE_SPECIFIC, AUTOTUNING)"
  - "CoVeR loop: generate → verify → refine (not generate → verify → accept)"
  - "Best-of tracking: keep best across all iterations, not just last"
  - "Intel XPU specific: leverages XMX, EU architecture, HBM"
  - "Triton as IR: higher-level than CUDA, compiles to SPIR-V for Intel GPUs"
