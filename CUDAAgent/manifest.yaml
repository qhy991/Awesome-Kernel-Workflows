schema_version: '1.1'
name: cudaagent-kernel-optimization
entrypoint: cuda-agent-kernel-optimization.js
backend:
  portability: vendor_locked
  matrix_eligible: partial
  intrinsic_to: NVIDIA NCU
  method_supported_backends:
  - cuda
  supported:
  - cuda
  default: cuda
  requires_capability:
    metrics:
    - dram_pct
    - sm_pct
  notes: 'Tier per spec §7.2 (vendor_locked, intrinsic to NCU). Legacy WORKFLOW_SUITABILITY=[''cuda''];
    cudaagent-guard.test.js validates.

    '
source:
  paper_title: 'CUDA-Agent: RL-Trained LLM Agents for GPU Kernel Optimization'
  paper_url: https://arxiv.org/abs/2602.24286
  paper_venue: arXiv 2026 (ByteDance/Tsinghua)
  notes: vendor_locked; full phase spec deferred.
workflow:
  name: cudaagent-kernel-optimization
  description: Skill-integrated multi-turn CUDA kernel optimization with profiling-driven
    iterative refinement (CUDA Agent methodology)
  when_to_use: 'When optimizing CUDA kernels from PyTorch operator specifications
    through iterative code generation, compilation, correctness testing, and profiling
    feedback. Follows the CUDA Agent skill-based workflow: profile baseline → identify
    bottlenecks → implement kernel + bindings → compile → verify correctness → measure
    speedup → refine until target met.'
  output_filename: cuda-agent-kernel-optimization.js
  directory: CUDAAgent/
routing:
  accepts:
    problem_type:
    - 'cuda-kernel-generation'
    - 'cuda-kernel-optimization'
    - 'gpu-kernel-optimization'
    constraints: []
  best_kernel_field: best_kernel_code
  # #32: declare fair_baseline_id so KerSor #39(a) (resolve-args.sh) pushes the
  # frozen contract.env::baseline_id into dispatch-args as args.fair_baseline_id.
  # The workflow echoes it back as output.baseline_id; check-acceptance-gate.sh
  # Check 2c compares that to contract.env::baseline_id (absent -> gate skips).
  all_args:
  - fair_baseline_id
  - termination_file
  - deadline_epoch
  - sol_cli
  - sol_task_dir
  - sol_bench_config
  - sol_seed_dir
  - sol_cuda_visible_devices
  - sol_ld_library_path
  - sol_env_prefix
  - sol_definition_path
  - sol_substrate_dir
  topology: iterative
  seed_contract: hybrid
  requires_harness: false
  languages:
  - cuda
  - metal
  - python_reference
  method_category: iterative_self_improving
  role: optimizer
  speedup_field: best_speedup_vs_compile
  required_one_of:
  - - kernel_path
    - problem_definition
    - problem_path
  backends:
  - cuda
  - cutlass
  - rocm
  - metal
  fidelity_boundary: inference_time_adaptation
  integration_patterns:
  - standalone
  - embedded_dispatch
  - embedded_inplace
  - sol_execbench_solution
  requires_ncu: false
  optimization_phases:
  - backend_native
  # Cross-DSL algorithmic priors — design 2026-07-09-triton-first-cuda-escalation-priors.
  # When escalate-native.py escalates from a portable-DSL producer (Triton /
  # TileLang) to this workflow, priors_for_native[] carries a closed enumeration
  # of algorithmic evidence (partition strategy, bound class, numeric floor).
  # This workflow's Implement phase honors those priors when a matching handoff
  # item is present. Fine schedule tokens (tile shapes, warp counts, pipeline
  # depths) are NOT consumed — they do not transfer. Informational metadata only.
  consumes:
  - algorithmic_priors

args:
  required: []
  optional:
  - name: native_task_result_file_handoff
    type: boolean
    description: Enable only after the native StructuredOutput canonical-file hook is installed and qualified. Return result references instead of model-transcribed measurements. Default false.
  - name: task_result_read_command
    type: string
    description: Optional CPU-only immutable task-result reconciliation command with {kernel_path}/{result_path}; must never submit GPU work. Used once to repair invalid result delivery.
  - name: task_result_command
    type: string
    description: Optional native full-task command with {kernel_path}/{result_path}; writes kersor-task-result-v1 JSON and an explicit frozen artifact. Final acceptance remains independent.
  - name: task_workload_count
    type: number
    description: Exact frozen full workload count required by the task-result gate.
