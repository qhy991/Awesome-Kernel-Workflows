name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Workflow count + badge sync
        run: |
          ./scripts/count-workflows.sh
          git diff --exit-code badges/workflows.json

      - name: Manifest coverage
        run: |
          pip install pyyaml --quiet
          ./scripts/validate-manifests.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Native turn lifecycle and helper guards
        run: |
          node --test \
            _meta/tools/test/turn-timeout-settlement.test.js \
            _meta/tools/test/turn-timeout-call-migration.test.js \
            _meta/tools/test/turn-timeout-propagation-guard.test.js \
            _meta/tools/test/argus-turn-timeout-guard.test.js \
            _meta/tools/test/ksearch-turn-timeout-guard.test.js \
            _meta/tools/test/cudaagent-watchdog-retry-guard.test.js \
            _meta/tools/test/patch-turn-timeout-refresh.test.js \
            _meta/tools/test/agent-retry-null-safety.test.js \
            _meta/tools/test/agent-retry-guard-lint.test.js \
            _meta/tools/test/scaffolding-ssot-debt-guard.test.js \
            _meta/tools/test/turn-timeout-unsettled.test.js \
            _meta/tools/test/seed-exhausted-terminal.test.js \
            _meta/tools/test/task-result-encoding.test.js \
            _meta/tools/test/ksearch-kernelfoundry-failure-boundaries.test.js \
            _meta/tools/test/accelopt-feedback-checkpoint.test.js \
            _meta/tools/test/cudallm-checkpoint.test.js \
            _meta/tools/test/cudaagent-execution-boundaries.test.js \
            _meta/tools/test/ksearch-file-handoff.test.js \
            _meta/tools/test/ksearch-task-result.test.js
          node scripts/check-fidelity-contracts.js
