schema_version: '1.1'
name: adaexplore-kernel-optimization
entrypoint: adaexplore-kernel-optimization.js
backend:
  portability: clean
  matrix_eligible: true
  method_supported_backends: any
  supported:
  - ascend
  - cuda
  - triton
  - metax
  default: cuda
  notes: 'Legacy WORKFLOW_SUITABILITY=[''triton''] (default triton). Driver-path supported=[cuda,
    triton] (default cuda). The default mismatch is a known divergence; triton-dryrun.test.js
    contract-tests the driver path.

    '
source:
  paper_title: 'AdaExplore: Failure-Driven Adaptation and Diversity-Preserving Search
    for Efficient Kernel Generation'
  paper_url: https://arxiv.org/abs/2604.16625
  paper_venue: arXiv 2026
  repo_url: https://github.com/StigLidu/AdaExplore
  commit_or_tag: ''
  license: MIT
  notes: 'Standalone inference/search translation of the paper method. The workflow
    preserves failure-grounded skill memory and MCTS exploration but does not claim
    to reproduce any unpublished training or service runtime.'
routing:
  accepts:
    problem_type:
    - 'triton-kernel-optimization'
    - 'triton-kernel-generation'
    constraints: []
  best_kernel_field: best_kernel_code
  all_args:
  - sol_cli
  - sol_task_dir
  - sol_bench_config
  - sol_seed_dir
  - sol_cuda_visible_devices
  - sol_ld_library_path
  - sol_env_prefix
  - sol_definition_path
  - sol_substrate_dir
  topology: mcts
  seed_contract: hybrid
  requires_harness: true
  languages:
  - triton
  - ascendc
  - python_reference
  - metax
  method_category: tree_exploration
  role: optimizer
  speedup_field: best_speedup
  fidelity_boundary: high_fidelity_method_translation
  requires_ncu: false
  integration_patterns:
  - standalone
  - embedded_dispatch
  - embedded_inplace
  - sol_execbench_solution
