schema_version: '1.1'
name: kernelfoundry-kernel-optimization
entrypoint: kernelfoundry-kernel-optimization.js
backend:
  portability: clean
  matrix_eligible: true
  method_supported_backends: any
  supported:
  - ascend
  - cuda
  - triton
  - metax
  default: cuda
  notes: 'Tier per spec §7.2 (clean, matrix-eligible). Legacy WORKFLOW_SUITABILITY
    =[''sycl'',''cuda'',''triton'']; SYCL is an output language with no registered
    driver — supported lists only backends with registered drivers under _substrate/backends/.
    SYCL path requires args.backend_dir pointing to a user-provided driver. kernelfoundry-triton-dryrun.test.js
    contract-tests the triton driver path.

    '
source:
  paper_title: 'Kernel Foundry: Evolutionary MAP-Elites Quality-Diversity Search for
    GPU Kernels'
  paper_url: https://arxiv.org/abs/2603.12440
  paper_venue: arXiv 2026 (Intel)
  notes: clean; full phase spec deferred.
workflow:
  name: kernelfoundry-kernel-optimization
  description: Evolutionary MAP-Elites quality-diversity search with meta-prompt evolution
    and templated parameter tuning (KernelFoundry methodology)
  when_to_use: When generating GPU kernels (SYCL/CUDA/Triton) from PyTorch operator
    specs and you need diverse, high-quality solutions across multiple optimization
    strategies. Prevents mode collapse via behavioral-descriptor archive. Best for
    KernelBench-style tasks, custom operators, and cross-platform (Intel/NVIDIA) kernel
    generation.
  output_filename: kernelfoundry-kernel-optimization.js
  directory: KernelFoundry/
routing:
  accepts:
    problem_type:
    - 'gpu-kernel-optimization'
    - 'kernel-generation'
    - 'kernel-search'
    constraints: []
  best_kernel_field: best_kernel_code
  # #32: declare fair_baseline_id so KerSor #39(a) (resolve-args.sh) pushes the
  # frozen contract.env::baseline_id into dispatch-args as args.fair_baseline_id.
  # The workflow echoes it back as output.baseline_id; check-acceptance-gate.sh
  # Check 2c compares that to contract.env::baseline_id (absent -> gate skips).
  all_args:
  - fair_baseline_id
  topology: evolutionary
  requires_harness: false
  languages:
  - cuda
  - triton
  - sycl
  - ascendc
  - python_reference
  - metax
  method_category: search_based
  role: optimizer
  speedup_field: best_speedup
  fidelity_boundary: algorithm_sketch_execution_risk
  requires_ncu: false
  integration_patterns:
  - standalone
  - embedded_dispatch
  - embedded_inplace
