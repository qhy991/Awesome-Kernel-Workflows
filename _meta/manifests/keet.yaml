# =============================================================================
# KEET Manifest — Generated from paper arXiv:2605.04467
# =============================================================================
# KEET: Explaining Performance of GPU Kernels Using LLM Agents
# Davis et al., University of Maryland / NVIDIA / LLNL, 2026
# =============================================================================

source:
  paper_title: "KEET: Explaining Performance of GPU Kernels Using LLM Agents"
  paper_url: "https://arxiv.org/abs/2605.04467"
  paper_venue: "arXiv 2026 (UMD / NVIDIA / LLNL)"
  repo_url: ""
  commit_or_tag: ""
  license: ""
  notes: "Methodology from Section III. Single-pass analysis pipeline with hypothesis-first approach."

workflow:
  name: "keet-kernel-explanation"
  description: "LLM-agent pipeline for interpreting NCU profiles into actionable kernel performance explanations (KEET methodology)"
  when_to_use: "When you need to understand WHY a CUDA kernel performs the way it does. Produces a natural language explanation report from NCU profiles + source code, identifying bottlenecks and suggesting specific code changes."
  output_filename: "keet-kernel-explanation.js"
  directory: "KEET/"

method:
  category: "single_pass_pipeline"
  core_insight: >
    Hypothesis-first analysis: generate performance predictions from code alone BEFORE
    seeing profiling data, then confirm/refute with measured NCU metrics. This prevents
    confirmation bias, produces interpretable explanations with clear provenance, and
    enables scalable analysis of large profile sets through adaptive metric selection.
  feedback_signal:
    type: "profiler_metric"
    description: "NCU profile metrics (stalls, throughput, occupancy, memory patterns) interpreted into natural language explanations"
    tool: "ncu"
    higher_is_better: false

topology:
  type: "pipeline"
  pipeline:
    pass_order:
      - "Source Inspection"
      - "Profile Inspection"
      - "Aggregation"
      - "Review"

phases:
  - name: "Setup"
    detail: "Collect NCU profiles, kernel source, and run configuration metadata"
    position: "preamble"
    agents:
      - label: "read-sources"
        description: "Read and catalog all kernel source files"
        parallelism: "single"
        input_variables: ["KERNEL_PATH", "SOURCE_PATHS"]
        output_schema:
          type: "object"
          properties:
            primary_source: { type: "string" }
            kernel_functions: { type: "array", items: { type: "string" } }
            total_sloc: { type: "number" }
          required: ["primary_source", "kernel_functions"]
      - label: "extract-profiles"
        description: "Extract NCU profile data from .ncu-rep files or generate new profiles"
        parallelism: "single"
        input_variables: ["NCU_REPORT_PATH", "NCU_BINARY", "EXP_DIR", "KERNEL_NAME_REGEX"]
        output_schema:
          type: "object"
          properties:
            primary_profile: { type: "object" }
            profile_count: { type: "number" }
          required: ["primary_profile", "profile_count"]

  - name: "Source Inspection"
    detail: "Iteratively analyze source files: describe, summarize algorithm, generate performance hypotheses"
    position: "loop_body"
    agents:
      - label: "source-inspection"
        description: "Algorithm Summarizer + Performance Hypothesizer — predict performance from code alone"
        parallelism: "single"
        input_variables: ["sourceData", "OP_DESC", "RUN_METADATA"]
        output_schema:
          type: "object"
          properties:
            algorithm_summary: { type: "string" }
            performance_hypotheses: { type: "array" }
          required: ["algorithm_summary", "performance_hypotheses"]

  - name: "Profile Inspection"
    detail: "Iteratively analyze NCU profiles: select metrics, produce grounded performance analysis"
    position: "loop_body"
    agents:
      - label: "profile-analysis-{label}"
        description: "Metric Selector + Profile Analyzer — grounded analysis with hypothesis-informed metric selection"
        parallelism: "parallel_fan_out"
        parallel_axis: "profilesToAnalyze"
        input_variables: ["algorithmSummary", "performanceHypotheses", "profile.metrics", "sourceData", "guidelines"]
        output_schema:
          type: "object"
          properties:
            primary_bottleneck: { type: "string" }
            optimization_suggestions: { type: "array" }
            full_analysis: { type: "string" }
          required: ["primary_bottleneck", "optimization_suggestions", "full_analysis"]
      - label: "drgpu-evaluator"
        description: "(Optional) DrGPU rule-based stall tree analysis"
        parallelism: "single"
        input_variables: ["profileData", "algorithmSummary"]
        output_schema:
          type: "object"
          properties:
            suggestions: { type: "array" }
            useful_suggestions: { type: "array" }
          required: ["suggestions"]

  - name: "Aggregation"
    detail: "Combine all analyses into a unified performance explanation report"
    position: "loop_body"
    agents:
      - label: "aggregate-report"
        description: "Analysis Aggregator — combine all profile analyses into final report"
        parallelism: "single"
        input_variables: ["OP_DESC", "algorithmSummary", "sourceDescriptions", "profileAnalyses", "drgpuAnalysis"]
        output_schema:
          type: "object"
          properties:
            executive_summary: { type: "string" }
            bottleneck_list: { type: "array" }
            full_report: { type: "string" }
            optimization_suggestions: { type: "array" }
          required: ["executive_summary", "bottleneck_list", "full_report"]

  - name: "Review"
    detail: "Cross-check explanation against pre-data hypotheses, confirm/refute/inconclusive"
    position: "epilogue"
    agents:
      - label: "explanation-review"
        description: "Explanation Reviewer — verify hypotheses against measured data"
        parallelism: "single"
        input_variables: ["performanceHypotheses", "aggregatedReport", "profileData"]
        output_schema:
          type: "object"
          properties:
            hypothesis_verdicts: { type: "array" }
            overall_quality: { type: "string" }
            review_summary: { type: "string" }
          required: ["hypothesis_verdicts", "overall_quality", "review_summary"]

plan_angles: []  # Not applicable — KEET is a pipeline, not an iterative planner

args:
  required:
    - name: "kernel_path"
      type: "string"
      description: "Path to the target CUDA kernel file (.cu)"
      example: "/path/to/kernel.cu"
  optional:
    - name: "ncu_report_path"
      type: "string"
      default: "''"
      description: "Path to existing .ncu-rep file (if not provided, will generate one)"
      example: "/path/to/report.ncu-rep"
    - name: "op_description"
      type: "string"
      default: "'CUDA kernel'"
      description: "Human-readable description of the kernel's operation"
      example: "Fan2 kernel from gaussian application"
    - name: "source_paths"
      type: "array"
      default: "[]"
      description: "Additional source files beyond the primary kernel"
      example: "['/path/to/utils.cuh']"
    - name: "ncu_binary"
      type: "string"
      default: "'ncu'"
      description: "Path to Nsight Compute binary"
    - name: "exp_dir"
      type: "string"
      default: "'/tmp/keet_exp'"
      description: "Directory for experiment artifacts"
    - name: "kernel_name_regex"
      type: "string"
      default: "''"
      description: "Regex for ncu -k to select the target kernel"
    - name: "run_metadata"
      type: "string"
      default: "''"
      description: "Description of kernel launch configuration and run settings"
      example: "Block size: 128, Grid: (256,1,1), Registers: 64"
    - name: "include_drgpu"
      type: "boolean"
      default: "false"
      description: "Enable DrGPU-style rule-based analysis (KEET+DrGPU mode)"
    - name: "additional_profiles"
      type: "array"
      default: "[]"
      description: "Additional .ncu-rep paths for multi-profile analysis"
      example: "['/path/to/profile_blocksize_256.ncu-rep']"
    - name: "analysis_guidelines_path"
      type: "string"
      default: "''"
      description: "Path to custom performance analysis guidelines file"
    - name: "harness_build_cmd"
      type: "string"
      default: "''"
      description: "Build command for profiling harness (if generating new profile)"
    - name: "harness_run_args"
      type: "string"
      default: "''"
      description: "Runtime arguments for harness binary"

correctness:
  criteria:
    - "All metric citations must reference actual values from the NCU profile"
    - "No hallucinated metric values"
    - "Hypotheses must be testable against profile data"
    - "Optimization suggestions must be specific to the analyzed code"
  check_type: "static_analysis"
  reference_output: "NCU profile data serves as ground truth for all claims"

return_fields:
  - name: "operation"
    type: "string"
    description: "Description of the analyzed operation"
    required: true
  - name: "algorithm_summary"
    type: "string"
    description: "Summary of the kernel algorithm from source inspection"
    required: true
  - name: "performance_hypotheses"
    type: "array"
    description: "Predictions generated from code alone (before data)"
    required: true
  - name: "hypothesis_verdicts"
    type: "array"
    description: "Confirmed/Refuted/Inconclusive for each hypothesis"
    required: true
  - name: "primary_bottleneck"
    type: "string"
    description: "Main performance bottleneck identified"
    required: true
  - name: "bottleneck_list"
    type: "array"
    description: "All bottlenecks with metric citations"
    required: true
  - name: "optimization_suggestions"
    type: "array"
    description: "Prioritized optimization suggestions with expected impact"
    required: true
  - name: "full_report"
    type: "string"
    description: "Complete natural language performance explanation report"
    required: true
  - name: "review_summary"
    type: "string"
    description: "Summary from the Explanation Reviewer"
    required: true
  - name: "review_quality"
    type: "string"
    description: "Overall quality assessment of the explanation"
    required: true
  - name: "drgpu_suggestions"
    type: "array"
    description: "DrGPU suggestions (null if include_drgpu=false)"
    required: false
  - name: "profiles_analyzed"
    type: "number"
    description: "Number of NCU profiles analyzed"
    required: true

template:
  base: "single-pass"
  customizations:
    - "custom_profiling"
