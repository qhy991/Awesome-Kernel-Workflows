# =============================================================================
# KernelFoundry (Hardware-Aware MAP-Elites) Manifest — schema v1.1
# =============================================================================
# Source: arXiv:2603.12440 "KernelFoundry: Hardware-aware evolutionary GPU
#         kernel optimization"
# Authors: Wiedemann, Leboutet, Paulitsch, Wofk, Ummenhofer (Intel)
#
# NOTE: This is the Intel "KernelFoundry" — DISTINCT from KernelFoundryDx
#       (arXiv:2605.30359, CUHK + Huawei) already in this repo. This one is
#       hardware-aware quality-diversity (MAP-Elites) search over SYCL/CUDA/Triton
#       candidates with meta-prompt co-evolution. Directory: KernelFoundry/.
# =============================================================================

source:
  paper_title: "KernelFoundry: Hardware-aware evolutionary GPU kernel optimization"
  paper_url: "https://arxiv.org/abs/2603.12440"
  paper_venue: "Preprint 2026"
  repo_url: ""
  commit_or_tag: ""
  license: ""
  notes: >
    Method from arXiv:2603.12440 (2026). Quality-diversity MAP-Elites search
    with three behavioral descriptors (d_mem, d_algo, d_sync, each 0..3 -> 64
    cells). Meta-prompt evolution: four evolvable prompt sections (philosophy,
    strategies, pitfalls, analysis_guidance) are mutated by a separate
    meta-prompter LLM every meta_prompt_interval generations using SEARCH/REPLACE
    edits derived from recent transitions. Templated parameter optimization:
    individual kernels may declare configurable parameters (tile sizes,
    work-group dims, unroll factors). Gradient-informed selection mixes fitness,
    improvement-rate, and exploration gradients (default 0.4/0.4/0.2). Targets
    Intel Arc + NVIDIA via SYCL/CUDA/Triton.

workflow:
  name: "kernelfoundry-kernel-optimization"
  description: "Evolutionary MAP-Elites quality-diversity search with meta-prompt evolution and templated parameter tuning (KernelFoundry methodology)"
  when_to_use: >
    When generating GPU kernels (SYCL/CUDA/Triton) from PyTorch operator specs
    and you need diverse, high-quality solutions across multiple optimization
    strategies. Prevents mode collapse via behavioral-descriptor archive. Best
    for KernelBench-style tasks, custom operators, and cross-platform
    (Intel/NVIDIA) kernel generation.
  output_filename: "kernelfoundry-kernel-optimization.js"
  directory: "KernelFoundry/"

method:
  category: "search_based"
  core_insight: >
    Replace single-trajectory iteration with quality-diversity (MAP-Elites) over
    a 4x4x4 behavioral grid (d_mem x d_algo x d_sync). Each generation:
    (1) gradient-informed selection from the occupied cells, (2) LLM mutation
    conditioned on evolved meta-prompt sections + parent + gradient hints,
    (3) compile/correctness/benchmark + behavioral classification, (4) insert
    into cell if it improves the local elite, (5) periodically a meta-prompter
    LLM rewrites the four evolvable prompt sections from recent transitions.
  feedback_signal:
    type: "throughput_delta"
    description: "Measured speedup vs PyTorch eager (higher is better). Behavioral coordinates are statically classified from kernel source. Fitness = 0 if not compiled, 0.1 if compiled-not-correct, else 0.5 + 0.5*min(1, speedup/target)."
    tool: "custom_bench"
    higher_is_better: true

# ---------------------------------------------------------------------------
# BACKEND POSTURE — Which (language x vendor) drivers this workflow can run
# ---------------------------------------------------------------------------
# Multi-backend by design (paper covers SYCL on Intel Arc + CUDA/Triton on NVIDIA).
# The _substrate currently provides cuda + triton drivers (experimental, GPU-deferred);
# sycl is supported in the legacy emit-code path only (deferred-driver — no
# _substrate/backends/sycl/ exists yet).
backend:
  supported: ["sycl", "cuda", "triton"]
  default: null
  matrix_eligible: partial   # cuda + triton only; sycl excluded until driver lands
  portability: "vendor_locked"
  intrinsic_to: ""
  requires_capability:
    metrics: ["latency_ms"]
    problem_types: ["kernel-optimization", "kernel-generation"]
  # sycl has no _substrate/backends/sycl/ driver as of P5d. USE_DRIVER with
  # args.backend="sycl" will fail at the load-driver agent (no manifest.json).
  # Legacy path (USE_DRIVER off) preserves full SYCL emit-code behavior for
  # callers that only need kernel synthesis without driver-evaluator dispatch.
  deferred_drivers: ["sycl"]

topology:
  type: "search"
  search:
    search_space_description: >
      A 4x4x4 grid of behavioral cells (64 total) over (d_mem, d_algo, d_sync).
      Each cell holds at most one elite kernel — the best fitness observed for
      that exact behavioral signature. Explored by an LLM mutation operator
      conditioned on a parent sampled from the occupied cells via mixed
      uniform / fitness-proportionate / curiosity selection.
    sampler: "evolutionary"
    pruning_strategy: "Per-cell elitism: a candidate is inserted iff it beats the local elite's fitness. globalBest tracks the best across cells. Cells that never see a better candidate are not updated."
    budget_arg: "generations"
  iterative:
    iterations_arg: "generations"
    convergence_condition: "All `generations` evolutionary generations completed"
    state_variables:
      - name: "archive"
        type: "object"
        initial_value: "{}"
        description: "MAP-Elites archive keyed by 'd_mem,d_algo,d_sync' -> {code, fitness, speedup, cell, id, strategy}"
      - name: "transitions"
        type: "array"
        initial_value: "[]"
        description: "Generation-by-generation log {parent_cell, child_cell, delta_f, outcome, gen}"
      - name: "globalBest"
        type: "object"
        initial_value: "{ code: '', fitness: 0, speedup: 0, cell: '' }"
        description: "Highest-fitness kernel seen across all cells"
      - name: "metaPrompt"
        type: "object"
        initial_value: "see workflow body"
        description: "Four evolvable prompt sections (philosophy/strategies/pitfalls/analysis_guidance)"
      - name: "promptArchive"
        type: "array"
        initial_value: "[]"
        description: "Snapshot of metaPrompt at each meta-evolution step"

phases:
  - name: "Setup"
    detail: "Parse task specification, establish baseline, initialize MAP-Elites archive"
    position: "preamble"
    agents:
      - label: "setup"
        description: "Operator analysis, baseline establishment, and feasible-cell identification"
        parallelism: "single"
        input_variables: ["TASK_SPEC", "OP_DESC", "TARGET_LANG", "TARGET_HW", "BENCH_CMD", "EXP_DIR"]
        output_schema:
          type: "object"
          properties:
            operator_code: { type: "string" }
            operator_type: { type: "string" }
            input_shapes: { type: "string" }
            baseline_time_ms: { type: "number" }
            hardware_info: { type: "string" }
            feasible_cells: { type: "array", items: { type: "string" } }
          required: ["operator_code", "baseline_time_ms"]

  - name: "Select"
    detail: "Sample parent(s) from archive using gradient-informed selection strategy"
    position: "loop_body"
    agents: []   # deterministic gradient-informed selection from occupied cells (no agent call)

  - name: "Vary"
    detail: "LLM generates offspring via mutation guided by meta-evolved prompts"
    position: "loop_body"
    agents:
      - label: "vary-{generation}"
        description: "Generate a child kernel conditioned on parent + evolved meta-prompt + gradient hints"
        parallelism: "single"
        input_variables: ["operatorCode", "OP_DESC", "TARGET_LANG", "TARGET_HW", "baselineTime", "metaPrompt", "selectedParent", "gradientHints"]
        output_schema:
          type: "object"
          properties:
            kernel_code: { type: "string" }
            strategy_description: { type: "string" }
            memory_pattern: { type: "string" }
            algorithm_type: { type: "string" }
            parallelism_level: { type: "string" }
            is_templated: { type: "boolean" }
            template_params: { type: "array", items: { type: "string" } }
          required: ["kernel_code", "strategy_description"]

  - name: "Evaluate"
    detail: "Compile, validate correctness, benchmark, classify behavioral coordinates"
    position: "loop_body"
    agents:
      - label: "eval-{generation}"
        description: "Compile + correctness + benchmark + assign behavioral coordinates (d_mem,d_algo,d_sync)"
        parallelism: "single"
        input_variables: ["offspringCode", "operatorCode", "TARGET_LANG", "TEST_CMD", "BENCH_CMD", "baselineTime"]
        output_schema:
          type: "object"
          properties:
            compiled: { type: "boolean" }
            correct: { type: "boolean" }
            speedup: { type: "number" }
            kernel_time_ms: { type: "number" }
            d_mem: { type: "number" }
            d_algo: { type: "number" }
            d_sync: { type: "number" }
            error_message: { type: "string" }
            performance_notes: { type: "string" }
          required: ["compiled", "correct", "speedup", "d_mem", "d_algo", "d_sync"]

  - name: "Insert"
    detail: "Update archive if offspring improves its behavioral cell; track transitions"
    position: "loop_body"
    agents: []   # deterministic per-cell elitism bookkeeping (no agent call)

  - name: "Evolve-Prompts"
    detail: "Meta-prompter analyzes outcomes, evolves prompt sections co-operatively"
    position: "loop_body"
    agents:
      - label: "meta-prompt-{generation}"
        description: "Meta-prompter LLM rewrites the four evolvable prompt sections from recent transitions (every meta_prompt_interval generations)"
        parallelism: "single"
        input_variables: ["metaPrompt", "transitions", "archive", "META_PROMPT_INTERVAL"]
        output_schema:
          type: "object"
          properties:
            optimization_philosophy: { type: "string" }
            optimization_strategies: { type: "string" }
            common_pitfalls: { type: "string" }
            analysis_guidance: { type: "string" }
            evolution_rationale: { type: "string" }
          required: ["optimization_philosophy", "optimization_strategies", "common_pitfalls", "analysis_guidance"]

  - name: "Evaluate"   # final report uses the existing Evaluate phase tag
    detail: "Write final technical report on MAP-Elites coverage, meta-prompt evolution, and best kernel"
    position: "epilogue"
    agents:
      - label: "final-report"
        description: "Quality-diversity analysis + meta-prompt evolution + best strategies + hardware-awareness evidence"
        parallelism: "single"
        input_variables: ["OP_DESC", "TARGET_LANG", "TARGET_HW", "baselineTime", "globalBest", "GENERATIONS", "archive", "transitions", "metaPrompt"]
        output_schema:
          type: "object"
          additionalProperties: true

plan_angles:
  - name: "memory_pattern_d_mem"
    description: "Explore the d_mem axis (scalar -> coalesced -> shared/local tiling -> multi-level hierarchy)"
    trigger: "Operator has data reuse or coalescing opportunities"
  - name: "algorithm_d_algo"
    description: "Explore d_algo axis (direct translation -> fusion -> reformulated -> novel algorithm)"
    trigger: "Standard algorithm has known reformulations (online norm, flash pattern, log-sum-exp)"
  - name: "parallelism_d_sync"
    description: "Explore d_sync axis (none -> work-group barriers -> sub-group primitives -> global coordination)"
    trigger: "Operation requires reduction, broadcast, or cross-thread coordination"
  - name: "meta_prompt_evolution"
    description: "Periodically rewrite the four evolvable prompt sections from recent transition outcomes"
    trigger: "Every meta_prompt_interval generations after the first"

args:
  required: []
  optional:
    - name: "problem_definition"
      type: "string"
      default: "''"
      description: "PyTorch reference source (Model/forward + get_inputs) for the target operator"
      example: "class Model(nn.Module): ..."
    - name: "problem_path"
      type: "string"
      default: "''"
      description: "Path to a problem-definition file (alternative to problem_definition)"
      example: "/path/to/spec.py"
    - name: "op_description"
      type: "string"
      default: "'GPU kernel'"
      description: "Human-readable description of the target operation"
      example: "Fused softmax + dropout"
    - name: "language"
      type: "string"
      default: "'cuda'"
      description: "Target language: sycl | cuda | triton. With backend_dir, must match the driver backend_id. SYCL has no _substrate driver as of P5d (legacy emit-code only)."
      example: "sycl"
    - name: "target_gpu"
      type: "string"
      default: "'NVIDIA GPU'"
      description: "Target hardware (e.g. Intel Arc B580, NVIDIA A6000, H100)"
      example: "Intel Arc B580"
    - name: "test_command"
      type: "string"
      default: "''"
      description: "User-provided correctness command (with {kernel_path}/{result_path} placeholders)"
      example: "python test.py {kernel_path} {result_path}"
    - name: "benchmark_command"
      type: "string"
      default: "''"
      description: "User-provided benchmark command (with {kernel_path}/{result_path} placeholders)"
      example: "python bench.py {kernel_path} {result_path}"
    - name: "descriptor_result_path"
      type: "string"
      default: "'<exp_dir>/descriptors/latest.json'"
      description: "Path where the descriptor evidence artifact is written"
      example: "/tmp/kernelfoundry_exp/descriptors/latest.json"
    - name: "archive_update_result_path"
      type: "string"
      default: "'<exp_dir>/archive/updates.jsonl'"
      description: "Path where archive-update events are appended"
      example: "/tmp/kernelfoundry_exp/archive/updates.jsonl"
    - name: "generations"
      type: "number"
      default: "30"
      description: "Number of MAP-Elites generations to run"
      example: "40"
    - name: "meta_prompt_interval"
      type: "number"
      default: "10"
      description: "Run the meta-prompter every N generations"
      example: "10"
    - name: "speedup_target"
      type: "number"
      default: "2.0"
      description: "Speedup at which fitness saturates to 1.0"
      example: "2.0"
    - name: "selection_strategy"
      type: "string"
      default: "'mixed'"
      description: "Parent-selection strategy: 'mixed' = uniform + fitness-proportionate + curiosity"
      example: "mixed"
    - name: "exp_dir"
      type: "string"
      default: "'/tmp/kernelfoundry_exp'"
      description: "Experiment directory for archive snapshots, descriptor artifacts, best-kernel output"
      example: "/tmp/kernelfoundry_exp"
    - name: "kernel_path"
      type: "string"
      default: "''"
      description: "Optional path to an existing kernel to seed the archive from (optimize_existing mode)"
      example: "/path/to/existing.cu"
    # --- v1.1 backend-axis args (P5d Stage B) ---
    - name: "backend"
      type: "string"
      default: "null"
      description: "Backend id (matches _substrate/backends/<id>); null -> use language. With backend_dir, must equal driver manifest backend_id."
      example: "cuda"
    - name: "backend_dir"
      type: "string"
      default: "''"
      description: "Path to the driver dir; empty -> legacy inline-prompt path (back-compat, byte-identical)."
      example: "_substrate/backends/cuda"
    - name: "substrate_dir"
      type: "string"
      default: "'_substrate'"
      description: "Path to the substrate root (diagnose.py + anti_cheat.py)"
      example: "_substrate"
    - name: "driver_shell_prefix"
      type: "string"
      default: "''"
      description: "Optional shell prefix for driver scripts (e.g. 'bash', 'env VAR=1')"
      example: "bash"
    - name: "substrate_command_prefix"
      type: "string"
      default: "''"
      description: "Optional command prefix for substrate Python tools (e.g. 'python3')"
      example: "python3"

correctness:
  criteria:
    - "Compiles in the target backend (SYCL/CUDA/Triton)"
    - "Numerical equivalence to the PyTorch reference within relative precision < 0.01 in 99% of outputs"
    - "Behavioral descriptors are assigned by STATIC pattern matching on source (not runtime)"
  check_type: "runtime_comparison"
  reference_output: "Run the PyTorch reference on the same inputs"

return_fields:
  - name: "input_mode"
    type: "string"
    description: "'optimize_existing' if kernel_path provided, else 'generate_then_optimize'"
    required: true
  - name: "language"
    type: "string"
    description: "Target language used (sycl/cuda/triton)"
    required: true
  - name: "best_speedup"
    type: "number"
    description: "Best measured speedup across all cells"
    required: true
  - name: "best_cell"
    type: "string"
    description: "Behavioral cell key 'd_mem,d_algo,d_sync' of the best kernel"
    required: true
  - name: "best_kernel_code"
    type: "string"
    description: "Source of the best kernel"
    required: true
  - name: "generations"
    type: "number"
    description: "Number of generations run"
    required: true
  - name: "archive_coverage"
    type: "number"
    description: "Count of occupied cells (0..64)"
    required: true
  - name: "archive_summary"
    type: "array"
    description: "Top 10 cells sorted by fitness"
    required: true
  - name: "improvements"
    type: "number"
    description: "Number of 'improvement' transitions"
    required: true
  - name: "discoveries"
    type: "number"
    description: "Number of 'discovery' transitions (newly occupied cells)"
    required: true
  - name: "final_meta_prompt"
    type: "object"
    description: "Final evolved meta-prompt sections"
    required: true
  - name: "prompt_evolution_history"
    type: "number"
    description: "Count of meta-prompt snapshots"
    required: true
  - name: "descriptor_result_path"
    type: "string"
    description: "Descriptor artifact path"
    required: true
  - name: "archive_update_result_path"
    type: "string"
    description: "Archive update jsonl path"
    required: true
  - name: "evidence_mode"
    type: "string"
    description: "'measured' if test+bench commands provided, else 'conservative_missing_evidence'"
    required: true
  - name: "report"
    type: "string"
    description: "Final technical report from the report agent"
    required: true

template:
  base: "search-based"
  customizations:
    - "evolutionary_ops"
    - "map_elites_archive"
    - "meta_prompt_evolution"
    - "behavioral_descriptors"
