# =============================================================================
# ARGUS Manifest — Generated from paper arXiv:2604.18616
# =============================================================================

source:
  paper_title: "ARGUS: Agentic GPU Optimization Guided by Data-Flow Invariants"
  paper_url: "https://arxiv.org/abs/2604.18616"
  paper_venue: "arXiv 2026 (CausalFlow / HKUST / Stanford / Tsinghua / UCAS / UC Riverside)"
  repo_url: ""
  commit_or_tag: ""
  license: ""
  notes: "Methodology from Sections 3-6. ICRL loop with data-flow invariant feedback."

workflow:
  name: "argus-kernel-optimization"
  description: "Agentic GPU kernel optimization guided by data-flow invariants with ICRL planning (ARGUS methodology)"
  when_to_use: "When optimizing performance-critical GPU kernels (GEMM, attention, MoE) that require coordinated reasoning over tiling, pipelining, and instruction scheduling. Uses data-flow invariants for dense feedback."
  output_filename: "argus-kernel-optimization.js"
  directory: "ARGUS/"

method:
  category: "iterative_self_improving"
  core_insight: >
    Data-flow invariants provide dense, structured feedback for GPU kernel optimization.
    Tag functions annotate tensor elements with symbolic coordinates; tag assertions verify
    relational constraints at use sites; violations produce concrete counterexamples
    (thread, element, program point) that guide targeted fixes. An ICRL planner learns
    to select optimizations and synthesize effective invariants across iterations.
  feedback_signal:
    type: "custom"
    description: "Compound reward: compile-time invariant violations (dense process reward) + unit test correctness + runtime throughput (TFLOPS)"
    tool: "custom_compiler_analysis + runtime_profiling"
    higher_is_better: true

topology:
  type: "iterative"
  iterative:
    iterations_arg: "iterations"
    convergence_condition: "No improvement for 3 consecutive iterations"
    state_variables:
      - name: "bestKernelCode"
        type: "string"
        initial_value: "null"
        description: "Source code of the current best kernel"
      - name: "bestThroughput"
        type: "number"
        initial_value: "0"
        description: "Best achieved throughput in TFLOPS"
      - name: "plannerPolicy"
        type: "string"
        initial_value: "''"
        description: "ICRL learned planner policy (natural language guidance)"
      - name: "optimizationHistory"
        type: "array"
        initial_value: "[]"
        description: "Log of all optimization attempts with outcomes"
      - name: "invariantViolationLog"
        type: "array"
        initial_value: "[]"
        description: "Concrete counterexamples from invariant violations"
      - name: "candidateBeam"
        type: "array"
        initial_value: "[]"
        description: "Top-K kernel candidates by throughput"

phases:
  - name: "Setup"
    detail: "Read kernel spec, hardware config, initialize knowledge base, baseline profiling"
    position: "preamble"
    agents:
      - label: "read-kernel"
        description: "Read and analyze the initial kernel implementation"
        parallelism: "single"
        input_variables: ["KERNEL_PATH", "KERNEL_SPEC", "HARDWARE_TARGET"]
        output_schema:
          type: "object"
          properties:
            kernel_code: { type: "string" }
            computation_type: { type: "string" }
            missing_optimizations: { type: "array" }
          required: ["kernel_code", "computation_type", "missing_optimizations"]
      - label: "baseline-perf"
        description: "Establish baseline performance through testing and benchmarking"
        parallelism: "single"
        input_variables: ["KERNEL_PATH", "TEST_CMD", "BENCH_CMD"]
        output_schema:
          type: "object"
          properties:
            throughput_tflops: { type: "number" }
            tests_pass: { type: "boolean" }
          required: ["throughput_tflops"]

  - name: "Plan"
    detail: "ICRL planner proposes optimizations + data-flow invariants from knowledge base"
    position: "loop_body"
    agents:
      - label: "plan-{iter}"
        description: "Generate ranked optimization proposals with invariants"
        parallelism: "single"
        input_variables: ["bestKernelCode", "bestThroughput", "KNOWLEDGE_BASE", "optimizationHistory", "invariantViolationLog", "plannerPolicy"]
        output_schema:
          type: "object"
          properties:
            proposals: { type: "array" }
          required: ["proposals"]

  - name: "Select"
    detail: "Sample from planner proposals, resolve optimization dependencies"
    position: "loop_body"
    agents:
      - label: "select-{iter}"
        description: "Select and sequence concrete optimization plan"
        parallelism: "single"
        input_variables: ["proposals"]
        output_schema:
          type: "object"
          properties:
            selected_plan: { type: "array" }
          required: ["selected_plan"]

  - name: "Lower"
    detail: "Lowering agent implements transformations with tag functions and assertions"
    position: "loop_body"
    agents:
      - label: "lower-{iter}-step{idx}"
        description: "Implement one optimization step with data-flow invariants"
        parallelism: "single"
        input_variables: ["currentCode", "step.optimization", "step.context", "step.invariant"]
        output_schema:
          type: "object"
          properties:
            transformed_code: { type: "string" }
            invariants_added: { type: "array" }
          required: ["transformed_code", "invariants_added"]

  - name: "Validate"
    detail: "Compile-time invariant checking + unit tests + runtime profiling → reward"
    position: "loop_body"
    agents:
      - label: "validate-{iter}"
        description: "Invariant checking + correctness tests + performance profiling"
        parallelism: "single"
        input_variables: ["currentCode", "loweringResults", "TEST_CMD", "BENCH_CMD", "bestThroughput"]
        output_schema:
          type: "object"
          properties:
            invariants_satisfied: { type: "boolean" }
            invariant_violations: { type: "array" }
            tests_pass: { type: "boolean" }
            throughput_tflops: { type: "number" }
            reward: { type: "number" }
          required: ["invariants_satisfied", "tests_pass", "throughput_tflops", "reward"]

  - name: "Learn"
    detail: "ICRL policy update via text gradients from invariant violation rewards"
    position: "loop_body"
    agents:
      - label: "learn-{iter}"
        description: "ICRL PolicyEval + Analyze + ParameterUpdate"
        parallelism: "single"
        input_variables: ["optimizationHistory", "invariantViolationLog", "plannerPolicy", "validateResult"]
        output_schema:
          type: "object"
          properties:
            policy_update: { type: "string" }
            key_learnings: { type: "array" }
          required: ["policy_update", "key_learnings"]

plan_angles:
  - name: "global_intrusive"
    description: "Kernel restructuring: software pipelining, split K, MFMA matmul, stagger K, async memcpy"
    trigger: "Large gap to peak throughput; kernel lacks multi-stage buffering or matrix core usage"
  - name: "local_source"
    description: "Localized patches: bank conflict mitigation, vectorized loads, loop unrolling, workgroup swizzling"
    trigger: "Shared memory bank conflicts visible; uncoalesced memory access; low ILP"
  - name: "isa_specific"
    description: "Hardware intrinsics: HW OOB-guarded loads, AGPR usage, instruction scheduling"
    trigger: "Register pressure high; pipeline stalls from poor scheduling; explicit branch overhead"

args:
  required:
    - name: "kernel_path"
      type: "string"
      description: "Path to the target kernel source file"
      example: "/path/to/flash_attn.py"
  optional:
    - name: "kernel_spec"
      type: "string"
      default: "''"
      description: "Natural language specification of the kernel"
      example: "Flash attention GQA, bf16, d=128, Br=256, Bc=64"
    - name: "target_gpu"
      type: "string"
      default: "'NVIDIA H100'"
      description: "Target GPU architecture"
      example: "AMD MI300X"
    - name: "test_command"
      type: "string"
      default: "''"
      description: "Command to run correctness tests"
    - name: "benchmark_command"
      type: "string"
      default: "''"
      description: "Command to run performance benchmark"
    - name: "iterations"
      type: "number"
      default: "5"
      description: "ICRL outer loop iterations"
    - name: "inner_steps"
      type: "number"
      default: "3"
      description: "Max lowering iterations per iteration"
    - name: "exp_dir"
      type: "string"
      default: "'/tmp/argus_exp'"
      description: "Directory for experiment artifacts"
    - name: "optimization_categories"
      type: "array"
      default: "['global_intrusive', 'local_source', 'isa_specific']"
      description: "Knowledge base categories to explore"

correctness:
  criteria:
    - "Data-flow invariants satisfied (compile-time tag assertion checking)"
    - "Unit tests pass (functional correctness)"
    - "No race conditions in shared memory access"
    - "Tiling covers full problem dimensions"
  check_type: "static_analysis"
  reference_output: "Unit test oracle provides reference"

return_fields:
  - name: "baseline_throughput_tflops"
    type: "number"
    description: "Starting throughput"
    required: true
  - name: "best_throughput_tflops"
    type: "number"
    description: "Best achieved throughput"
    required: true
  - name: "overall_speedup"
    type: "number"
    description: "Speedup ratio"
    required: true
  - name: "optimization_history"
    type: "array"
    description: "All optimization attempts with outcomes"
    required: true
  - name: "planner_policy_final"
    type: "string"
    description: "Final learned ICRL planner policy"
    required: true
  - name: "best_kernel_code"
    type: "string"
    description: "Source code of best kernel"
    required: true
  - name: "report"
    type: "string"
    description: "Final optimization report"
    required: true

template:
  base: "iterative-loop"
  customizations:
    - "experience_memory"
    - "custom_profiling"
