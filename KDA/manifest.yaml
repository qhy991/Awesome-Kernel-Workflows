schema_version: '1.1'
name: kda-kernel-workflow
entrypoint: kda-kernel-workflow.js
backend:
  portability: clean
  matrix_eligible: true
  method_supported_backends: any
  supported:
  - cuda
  - triton
  - metax
  - ascend
  default: cuda
  notes: 'Legacy WORKFLOW_SUITABILITY=[''cuda'']. Driver-path supported=[cuda, triton].
    triton-dryrun.test.js contract-tests the driver path.

    '
routing:
  accepts:
    problem_type:
    - 'cuda-kernel-optimization'
    - 'cuda-kernel-generation'
    - 'ascend-kernel-optimization'
    - 'ascend-kernel-generation'
    constraints: []
  best_kernel_field: best_candidate
  # #32: declare fair_baseline_id so KerSor #39(a) (resolve-args.sh) pushes the
  # frozen contract.env::baseline_id into dispatch-args as args.fair_baseline_id.
  # The workflow echoes it back as output.baseline_id; check-acceptance-gate.sh
  # Check 2c compares that to contract.env::baseline_id (absent -> gate skips).
  all_args:
  - fair_baseline_id
  - sol_cli
  - sol_task_dir
  - sol_bench_config
  - sol_seed_dir
  - sol_cuda_visible_devices
  - sol_ld_library_path
  - sol_env_prefix
  - sol_definition_path
  - sol_substrate_dir
  topology: iterative
  seed_contract: hybrid
  requires_harness: false
  languages:
  - cuda
  - cutlass
  - rocm
  - metax
  - ascendc
  method_category: iterative_self_improving
  role: optimizer
  speedup_field: best_score
  fidelity_boundary: strict_high_fidelity
  requires_ncu: false
  integration_patterns:
  - standalone
  - embedded_dispatch
  - embedded_inplace
  - sol_execbench_solution
