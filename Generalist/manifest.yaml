schema_version: '1.1'
name: generalist-kernel-optimization
entrypoint: generalist-kernel-optimization.js
backend:
  portability: clean
  matrix_eligible: true
  method_supported_backends: any
  supported:
  - cuda
  - triton
  - metax
  default: cuda
source:
  paper_title: KerSor Solver SDK — Best-of-Breed Reference Solver
  paper_url: ''
  paper_venue: ''
  repo_url: ''
  commit_or_tag: ''
  license: ''
  notes: 'Internal reference implementation. Combines the seven composable axis components
    (Layers A-F) of the KerSor substrate into a single beam-search solver. Deterministic
    diagnosis, persistent state-keyed memory, method gating, anti-cheat reward, and
    adversarial insight verification.

    '
workflow:
  name: generalist-kernel-optimization
  description: 'Best-of-breed single solver built on the KerSor Solver SDK substrate:
    deterministic diagnosis, persistent state-keyed memory, method gating, anti-cheat
    reward, and a beam controller.'
  when_to_use: 'When you want one directly-callable kernel optimizer that internalizes
    the universal best-of-breed components (the 7 composable axes) with a single beam
    search topology. For cross-topology coverage, orchestrate with KerSor instead.

    '
  output_filename: generalist-kernel-optimization.js
  directory: Generalist/
method:
  category: iterative_self_improving
  core_insight: 'Combines all seven composable substrate axes (evidence, anti-cheat,
    diagnosis, memory, method-gate, insight-verification, cost-control) with a beam-search
    controller. Each iteration profiles the current best candidate, diagnoses its
    bottleneck class via the deterministic substrate, retrieves prior knowledge from
    persistent memory, gates allowed methods, generates BREADTH plans, evaluates each
    with anti-cheat reward, and updates the beam with the top-K candidates.

    '
  feedback_signal:
    type: throughput_delta
    description: speedup — candidate latency vs eager/baseline latency; gated by anti_cheat.py
      to prevent reward manipulation
    tool: custom_bench
    higher_is_better: true
topology:
  type: iterative
  iterative:
    iterations_arg: iterations
    convergence_condition: 'Stop when target_speedup is reached (COMPLETE), stagnation
      limit hit (2 consecutive rounds with < 2% improvement -> STALLED), loop-until-dry
      limit (2 rounds with no measured insight -> STALLED), or token budget exhausted.

      '
    state_variables:
    - name: candidateBeam
      type: array
      initial_value: '[{id:''baseline'', parent_id:null, code_path:KERNEL_PATH, speedup:1.0,
        metrics:{}, planTitle:''baseline''}]'
      description: Top-K beam of candidate kernels sorted by recorded speedup
    - name: bestSpeedup
      type: number
      initial_value: '1.0'
      description: Best speedup across all iterations
    - name: stagnantRounds
      type: number
      initial_value: '0'
      description: Consecutive rounds with < STAGNATION_EPS improvement
    - name: dryRounds
      type: number
      initial_value: '0'
      description: Consecutive rounds with no new measured insight
    - name: allAttempts
      type: array
      initial_value: '[]'
      description: Log of all attempt outcomes across iterations
    - name: verifiedInsights
      type: array
      initial_value: '[]'
      description: Verified typed insights for the Layer A envelope
phases:
- name: Setup
  detail: Read kernel + baseline, init beam, locate substrate scripts
  position: preamble
  agents:
  - label: generate-initial-kernel
    description: Generate and verify initial kernel when no kernel_path provided (generate_then_optimize
      mode)
    parallelism: single
    input_variables:
    - PROBLEM_DEFINITION
    - PROBLEM_PATH
    - OP
    - LANGUAGE
    - TARGET_GPU
    - SEED_CANDIDATES
    - EVAL_CMD
    - NCU_CMD
    - EXP_DIR
    output_schema:
      type: object
      properties:
        generated_kernel_path:
          type: string
        initial_candidates:
          type: array
          items:
            type: object
        initial_generation_result:
          type: object
      required:
      - generated_kernel_path
      - initial_candidates
      - initial_generation_result
- name: Profile
  detail: Profile current best (ncu/benchmark) into normalized metrics
  position: loop_body
  agents:
  - label: profile-{iter}
    description: Profile the current best kernel and produce normalized metrics
    parallelism: single
    input_variables:
    - best.code_path
    - OP
    - NCU_CMD
    - EVAL_CMD
    output_schema:
      type: object
      properties:
        compiled:
          type: boolean
        correct:
          type: boolean
        candidate_latency_ms:
          type:
          - number
          - 'null'
        eager_latency_ms:
          type:
          - number
          - 'null'
        compile_latency_ms:
          type:
          - number
          - 'null'
        speedup:
          type:
          - number
          - 'null'
        metrics:
          type: object
      required:
      - compiled
      - correct
      - speedup
      - metrics
- name: Diagnose
  detail: diagnose.py -> shared bottleneck_class (Layer C)
  position: loop_body
  agents:
  - label: diagnose-{iter}
    description: Run substrate diagnose.py to determine bottleneck class
    parallelism: single
    input_variables:
    - metrics
    - EXP_DIR
    - SUBSTRATE
    output_schema:
      type: object
      additionalProperties: true
- name: Retrieve
  detail: memory_store.py retrieve + method_gate.py allowed_methods (Layers D, E)
  position: loop_body
  agents:
  - label: retrieve-{iter}
    description: Retrieve prior techniques from persistent memory
    parallelism: parallel_fan_out
    parallel_axis: memory + gate
    input_variables:
    - MEMORY_DB
    - bclass
    - EXP_DIR
    - SUBSTRATE
    output_schema:
      type: object
      additionalProperties: true
  - label: gate-{iter}
    description: Gate allowed methods based on bottleneck class
    parallelism: parallel_fan_out
    input_variables:
    - bclass
    - EXP_DIR
    - SUBSTRATE
    output_schema:
      type: object
      additionalProperties: true
- name: Plan
  detail: Generate BREADTH plans, gated to allowed_methods, with grounded anchors
  position: loop_body
  agents:
  - label: plan-{iter}-{i}
    description: Propose one optimization plan using only allowed methods
    parallelism: parallel_fan_out
    parallel_axis: breadth
    count_arg: breadth
    input_variables:
    - bclass
    - allowed
    - priorTech
    - deadEnds
    - best
    - OP
    output_schema:
      type: object
      additionalProperties: true
- name: Evaluate
  detail: Implement + eval each plan; anti_cheat.py reward; evidence_schema.py (Layers
    A, B)
  position: loop_body
  agents:
  - label: impl-{iter}-{i}
    description: Implement plan on a copy of best kernel, run benchmark
    parallelism: parallel_fan_out
    parallel_axis: plans
    input_variables:
    - best.code_path
    - plan
    - EVAL_CMD
    - runDir
    output_schema:
      type: object
      properties:
        compiled:
          type: boolean
        correct:
          type: boolean
        speedup:
          type:
          - number
          - 'null'
        metrics:
          type: object
      required:
      - compiled
      - correct
      - speedup
      - metrics
  - label: anticheat-{iter}-{i}
    description: Run anti_cheat.py + evidence_schema.py validation
    parallelism: single
    input_variables:
    - metrics
    - runDir
    - SUBSTRATE
    output_schema:
      type: object
      properties:
        valid:
          type: boolean
        reward:
          type: number
        recorded_speedup:
          type: number
        reward_reason:
          type: string
        flags:
          type: array
        blocking_flags:
          type: array
      required:
      - valid
      - reward
      - recorded_speedup
- name: Learn
  detail: memory_store.py update with measured outcome; record dead-ends; beam top-K
  position: loop_body
  agents:
  - label: learn-{iter}-{method}
    description: Update persistent memory with measured outcome
    parallelism: parallel_fan_out
    parallel_axis: evaluated
    input_variables:
    - MEMORY_DB
    - bclass
    - plan.method
    - metrics
    - anticheat
    output_schema:
      type: object
      additionalProperties: true
  - label: refute-{iter}
    description: Adversarially refute bottleneck attribution against measured profile
    parallelism: single
    input_variables:
    - metrics
    - roundInsightRaw
    output_schema:
      type: object
      properties:
        refuted:
          type: boolean
        reason:
          type: string
      required:
      - refuted
  - label: verify-insight-{iter}
    description: Write and verify insight via verify_insight.py
    parallelism: single
    input_variables:
    - roundInsightRaw
    - refute
    - EXP_DIR
    - SUBSTRATE
    output_schema:
      type: object
      additionalProperties: true
- name: Report
  detail: Final report + Layer A evidence envelope
  position: epilogue
  agents:
  - label: final-report
    description: Write final optimization report
    parallelism: single
    input_variables:
    - OP
    - bestSpeedup
    - status
    - candidateBeam
    - allAttempts
    output_schema:
      type: object
      additionalProperties: true
plan_angles:
- name: memory_hierarchy
  description: Optimize shared memory tiling, register caching, async global→shared
    copies
  trigger: Kernel is memory-bandwidth-bound or has high global memory traffic
- name: parallelism
  description: Restructure thread/warp/block decomposition for occupancy and load
    balance
  trigger: Low occupancy, tail effects, or load imbalance across SMs
- name: compute_specialization
  description: Leverage tensor cores, warp-level matrix ops, or specialized instructions
  trigger: Operation has matrix structure mapping to tensor cores or SIMT reduction
- name: kernel_fusion
  description: Fuse multiple operations to eliminate intermediate memory traffic
  trigger: Sequential kernel launches with producer-consumer dependency
- name: algorithmic
  description: Apply algorithmic changes — online softmax, flash attention, log-sum-exp
  trigger: Standard algorithm has known numerically-stable or compute-reduced alternative
args:
  required:
  - name: benchmark_command
    type: string
    description: Command to benchmark the kernel; must write JSON with compiled/correct/speedup/metrics
    example: python bench.py {kernel_path} {result_path}
  optional:
  - name: kernel_path
    type: string
    default: ''''''
    description: Path to existing kernel to optimize; omit for generate_then_optimize
      mode
    example: /path/to/kernel.cu
  - name: problem_definition
    type: string
    default: ''''''
    description: Textual problem definition for kernel generation
    example: Quantized GEMM Q4_0 weight x FP32 activation
  - name: problem_path
    type: string
    default: ''''''
    description: Path to a problem definition file
    example: /path/to/spec.yaml
  - name: op_description
    type: string
    default: '''kernel optimization'''
    description: Human-readable description of the target operation
    example: Quantized GEMM Q4_0 weight x FP32 activation
  - name: language
    type: string
    default: '''cuda'''
    description: 'Target language: cuda'
    example: cuda
  - name: target_gpu
    type: string
    default: '''unknown GPU'''
    description: Target GPU architecture
    example: A100
  - name: ncu_command
    type: string
    default: ''''''
    description: DEPRECATED v1.1 alias for profile_command
    example: ''
  - name: substrate_dir
    type: string
    default: '''_substrate'''
    description: Path to the KerSor substrate scripts directory
    example: _substrate
  - name: substrate_command_prefix
    type: string
    default: ''''''
    description: Interpreter prefix for substrate Python scripts
    example: python3
  - name: exp_dir
    type: string
    default: '''.'''
    description: Directory for experiment artifacts
    example: /tmp/generalist_exp
  - name: memory_db
    type: string
    default: '''{exp_dir}/memory.json'''
    description: Path to persistent memory database
    example: /tmp/generalist_exp/memory.json
  - name: iterations
    type: number
    default: '3'
    description: Maximum number of optimization iterations
    example: '5'
  - name: breadth
    type: number
    default: '3'
    description: Number of parallel plans per iteration
    example: '3'
  - name: topk
    type: number
    default: '3'
    description: Beam width — top-K candidates to keep
    example: '3'
  - name: target_speedup
    type: number
    default: '1.5'
    description: Target speedup to reach before stopping
    example: '2.0'
  - name: seed_candidates
    type: number
    default: '3'
    description: Number of seed candidates for generate_then_optimize mode
    example: '3'
  - name: backend
    type: string
    default: 'null'
    description: Backend id (matches _substrate/backends/<id>); null -> use backend.default
      from manifest
    example: cuda
  - name: backend_dir
    type: string
    default: ''''''
    description: Path to the driver dir; empty -> legacy inline-prompt path (back-compat)
    example: _substrate/backends/cuda
  - name: profile_command
    type: string
    default: ''''''
    description: Neutral profile command template (replaces legacy ncu_command). Empty
      -> driver-resolved.
    example: ncu --csv --target-processes all -o {out} {bin}
correctness:
  criteria:
  - Output matches reference within tolerance (torch.allclose or equivalent)
  - No compilation errors or runtime crashes
  - 'Anti-cheat validation passes (anti_cheat.py: no reward manipulation)'
  - Evidence schema validation passes (evidence_schema.py)
  check_type: runtime_comparison
  reference_output: Run baseline kernel on same inputs; compare via benchmark_command
return_fields:
- name: input_mode
  type: string
  description: Whether optimize_existing or generate_then_optimize
  required: true
- name: solver
  type: string
  description: Always 'generalist-kernel-optimization'
  required: true
- name: topology
  type: string
  description: Always 'beam'
  required: true
- name: overall_speedup
  type: number
  description: Best speedup achieved across all iterations
  required: true
- name: best_kernel_code
  type: string
  description: Path to the best kernel code
  required: true
- name: convergence_status
  type: string
  description: 'One of: converged, stalled, budget_exhausted'
  required: true
- name: beam
  type: array
  description: Final beam of top-K candidates
  required: true
- name: attempts
  type: array
  description: Log of all attempt outcomes
  required: true
- name: insights
  type: array
  description: Verified typed insights from adversarial refutation
  required: true
- name: memory_db
  type: string
  description: Path to the persistent memory database used
  required: true
template:
  base: iterative-loop
  customizations:
  - experience_memory
  - early_stopping
  - custom_profiling
routing:
  best_kernel_field: best_kernel_code
  topology: iterative
  requires_harness: true
  languages:
  - cuda
  - triton
  - metax
  method_category: iterative_self_improving
  role: optimizer
  speedup_field: overall_speedup
  fidelity_boundary: substrate_reference
  requires_ncu: false
